<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Génie — the growing page</title>
  <desc>A worn book lies open in gentle perspective. A finely barbed goose quill rests diagonally over its blank, curled parchment pages, while a small two-leaved seedling rises from the binding seam. Muted blue-grey engraving with warm paper washes.</desc>
  <defs>
    <linearGradient id="gn-cover" x1="82" y1="208" x2="221" y2="312" gradientUnits="userSpaceOnUse"><stop stop-color="#8d989c"/><stop offset="1" stop-color="#687d8c"/></linearGradient>
    <linearGradient id="gn-block" x1="163" y1="256" x2="170" y2="307" gradientUnits="userSpaceOnUse"><stop stop-color="#d9ccb0"/><stop offset="1" stop-color="#b7aa91"/></linearGradient>
    <linearGradient id="gn-page-left" x1="81" y1="200" x2="174" y2="253" gradientUnits="userSpaceOnUse"><stop stop-color="#e3dac4"/><stop offset=".72" stop-color="#d8ccb2"/><stop offset="1" stop-color="#b6aa91"/></linearGradient>
    <linearGradient id="gn-page-right" x1="284" y1="195" x2="181" y2="241" gradientUnits="userSpaceOnUse"><stop stop-color="#e6ddc8"/><stop offset=".75" stop-color="#dbd0b8"/><stop offset="1" stop-color="#b7aa93"/></linearGradient>
