<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fest-overview-title fest-overview-desc">
  <title id="fest-overview-title">The remaining gifts of the year</title>
  <desc id="fest-overview-desc">A shallow handwoven basket gathers an acorn, an opened dry seed pod, a feather, an olive sprig and a small wildflower. Beside its rim a sixth gift, a split seed with two young leaves, begins to grow. Quiet ochre and olive washes with fine natural-history engraving.</desc>
