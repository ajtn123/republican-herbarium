<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Opinion — dialogue in the willow</title>
  <desc>Two small songbirds face one another on the unequal arms of a forked willow twig. The lower bird parts its slender beak; its companion turns a quiet, attentive head toward it. Individually drawn flight feathers, soft mauve plumage and a few narrow willow leaves give this modern allegory of dialogue the character of a natural-history plate.</desc>
