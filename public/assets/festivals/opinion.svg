    <linearGradient id="op-wood" x1="140" y1="282" x2="205" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#777360"/><stop offset=".5" stop-color="#9a9681"/><stop offset="1" stop-color="#817b68"/></linearGradient>
    <linearGradient id="op-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a0a48a" stop-opacity=".57"/><stop offset="1" stop-color="#6f7c66" stop-opacity=".35"/></linearGradient>
