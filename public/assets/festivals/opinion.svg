    <linearGradient id="op-right-head" x1="218" y1="106" x2="241" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#9b8d93"/><stop offset=".46" stop-color="#b3a6a8"/><stop offset="1" stop-color="#c8bfb7"/></linearGradient>
