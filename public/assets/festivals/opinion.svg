    <linearGradient id="op-left-wing" x1="94" y1="157" x2="127" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#a4959c"/><stop offset=".48" stop-color="#8b6d86"/><stop offset="1" stop-color="#6e626c"/></linearGradient>
