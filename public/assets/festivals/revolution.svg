  <path d="M58 265C99 251 138 261 176 267C205 272 229 269 250 279C268 275 299 277 318 291C288 303 252 302 216 298C168 296 132 289 93 286C76 283 60 275 58 265Z" fill="url(#rv-ground)"/>
