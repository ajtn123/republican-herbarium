  <path d="M67 238C65 219 75 194 88 176C103 154 107 128 120 105C133 80 150 68 169 72C190 75 203 88 221 93C238 100 249 111 249 127C249 139 241 150 229 151C220 151 211 147 205 140C205 167 218 190 226 210C230 220 232 230 229 239C204 254 107 260 67 238Z" fill="url(#rv-felt)" stroke="#754735" stroke-width="1.7"/>
