    <path d="M240 196L234 194M245 202L242 206M251 208L253 202M235 184L231 185M266 170L260 168M269 177L273 174M260 153L262 148M308 178L312 178M311 168L310 164M317 160L319 156" stroke-width=".48" opacity=".62"/>
