  <g stroke="#414a40" stroke-width="1.2" fill="url(#rv-iron)" fill-rule="evenodd">
    <path d="M191 250C198 246 208 250 218 256L233 265C241 271 240 278 233 281C225 284 215 279 205 273L191 264C184 258 185 253 191 250ZM195 255C192 257 195 260 200 263L215 272C222 276 228 279 232 276C235 274 232 271 227 268L212 259C204 255 198 252 195 255Z"/>
