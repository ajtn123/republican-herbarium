  <path d="M70 236C86 242 98 243 113 247C146 254 176 255 203 250C213 248 220 246 225 243" stroke="#d2a086" stroke-width=".8" opacity=".58"/>
  <g stroke="#784633" stroke-width=".65" opacity=".7">
    <path d="M81 242L83 247M86 243L88 249M105 248L108 254M111 249L113 255M129 253L131 257M134 254L135 258M183 254L183 258M188 254L188 257M214 247L212 252M218 246L216 251"/>
  </g>

