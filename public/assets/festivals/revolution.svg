<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Révolution — liberty and new growth</title>
  <desc>A softly folded terracotta Phrygian cap rests beside a few worn iron chain links. An oak shoot rises through a separated, broken link, its lobed leaves opening into the quiet space beside the felt.</desc>
  <defs>
    <linearGradient id="rv-felt" x1="109" y1="109" x2="211" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c08b73"/><stop offset=".39" stop-color="#af6b51"/><stop offset=".76" stop-color="#a2563d"/><stop offset="1" stop-color="#824a38"/>
    </linearGradient>
    <linearGradient id="rv-fold" x1="176" y1="85" x2="225" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c38e76"/><stop offset=".55" stop-color="#b5765c"/><stop offset="1" stop-color="#8c4b36"/>
    </linearGradient>
    <linearGradient id="rv-rim" x1="139" y1="222" x2="146" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4755a"/><stop offset=".49" stop-color="#a2563d"/><stop offset="1" stop-color="#774534"/>
    </linearGradient>
    <linearGradient id="rv-iron" x1="221" y1="266" x2="224" y2="289" gradientUnits="userSpaceOnUse">
      <stop stop-color="#85867a"/><stop offset=".28" stop-color="#60665b"/><stop offset=".75" stop-color="#4b5147"/><stop offset="1" stop-color="#737568"/>
    </linearGradient>
    <linearGradient id="rv-leaf" x1="259" y1="157" x2="289" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#98a087"/><stop offset=".6" stop-color="#7c896e"/><stop offset="1" stop-color="#66765d"/>
    </linearGradient>
    <linearGradient id="rv-ground" x1="179" y1="270" x2="179" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6a6251" stop-opacity=".08"/><stop offset="1" stop-color="#6a6251" stop-opacity="0"/>
    </linearGradient>
  </defs>

