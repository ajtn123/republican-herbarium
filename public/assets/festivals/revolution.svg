  <path d="M305 279C300 274 289 272 280 275C269 278 265 285 270 292C275 298 288 300 299 296C307 293 312 286 309 282L304 284C306 287 301 291 296 293C288 296 278 294 274 290C271 287 274 283 282 280C289 278 297 279 301 283Z" fill="url(#rv-iron)" stroke="#414a40" stroke-width="1.2"/>
  <path d="M305 279L301 283L299 281L302 277ZM309 282L304 284L305 287L310 285Z" fill="#8b8877" stroke="#414a40" stroke-width=".8"/>
  <path d="M273 283C278 277 290 275 299 279M273 292C279 297 292 297 299 294" stroke="#a1a28f" stroke-width=".65" opacity=".67"/>
  <g stroke="#363f35" stroke-width=".55" opacity=".66">
    <path d="M276 295L278 292M280 297L281 294M284 298L285 295M295 296L294 294M269 286L272 285M273 280L275 282M305 289L307 289"/>
  </g>

  <!-- A young oak rises through the empty link; the front of the iron overlaps its foot. -->
  <path d="M287 292C285 284 279 275 277 263C273 248 275 229 278 214C281 198 280 182 284 169" stroke="#52604b" stroke-width="2.05"/>
  <path d="M287 291C284 278 279 269 279 258C277 241 279 227 280 215" stroke="#a3aa8d" stroke-width=".65"/>
  <path d="M277 240C269 231 259 221 252 212M280 216C289 208 297 200 302 189M280 195L269 180" stroke="#52604b" stroke-width="1.1"/>
  <g fill="url(#rv-leaf)" stroke="#53604b" stroke-width="1.05">
    <path d="M254 215C249 215 245 211 245 207C240 209 234 205 236 201C230 202 226 198 229 194C221 194 218 189 222 185C215 183 213 176 218 173C216 167 220 162 224 164C224 158 230 155 233 159C239 154 244 158 242 163C250 162 253 167 249 172C257 173 260 178 256 183C263 186 263 191 258 194C263 200 260 208 254 215Z"/>
