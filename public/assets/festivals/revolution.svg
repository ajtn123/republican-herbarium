  <path d="M284 170C282 163 283 155 287 151C291 155 291 164 287 170Z" fill="#95836a" stroke="#52604b" stroke-width=".85"/>
  <path d="M286 166L287 156M284 161L289 160" stroke="#665e48" stroke-width=".55"/>
