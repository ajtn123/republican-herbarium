<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="recompenses-title recompenses-desc">
  <title id="recompenses-title">Récompenses — a loosely bound crown</title>
  <desc id="recompenses-desc">An open crown of laurel and oak lies at a slight angle. Uneven olive and ochre leaves follow the bent twigs, bound by a narrow folded ribbon from which a small, plain, worn bronze medallion rests. Fine botanical veins, bark strokes, fabric folds and quiet metal hatching.</desc>
