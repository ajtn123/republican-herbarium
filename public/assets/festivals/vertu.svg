    <linearGradient id="vertu-wood" x1="84" y1="294" x2="285" y2="204" gradientUnits="userSpaceOnUse"><stop stop-color="#96917a" stop-opacity=".48"/><stop offset=".65" stop-color="#737961" stop-opacity=".7"/><stop offset="1" stop-color="#a6a38a" stop-opacity=".52"/></linearGradient>
    <linearGradient id="vertu-leaf" x1="167" y1="106" x2="207" y2="168" gradientUnits="userSpaceOnUse"><stop stop-color="#a3ac8f" stop-opacity=".48"/><stop offset=".43" stop-color="#899774" stop-opacity=".68"/><stop offset="1" stop-color="#6a7857" stop-opacity=".8"/></linearGradient>
    <linearGradient id="vertu-nest" x1="149" y1="206" x2="190" y2="278" gradientUnits="userSpaceOnUse"><stop stop-color="#ada88b"/><stop offset=".45" stop-color="#929174"/><stop offset="1" stop-color="#72795d"/></linearGradient>
    <radialGradient id="vertu-hollow" cx=".46" cy=".42" r=".62"><stop stop-color="#69745b"/><stop offset=".7" stop-color="#7c8064"/><stop offset="1" stop-color="#a6a487"/></radialGradient>
