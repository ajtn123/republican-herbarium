<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vertu-title vertu-desc">
  <title id="vertu-title">Vertu — a sheltered nest</title>
  <desc id="vertu-desc">Two pale eggs rest in a finely interlaced nest held in the fork of an oak bough. A single irregularly lobed oak leaf bends over them, an intimate allegory of care and protection in muted olive pigment and botanical ink.</desc>
