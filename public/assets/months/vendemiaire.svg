<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <title>Vendémiaire — the grape harvest</title>
  <desc>A ripe, softly russet bunch of grapes hangs from a curved woody vine, beside a veined five-lobed grape leaf and a fine coiling tendril. Irregular fruit, overlapping skins and delicate engraved strokes give the cluster its weight.</desc>
  <defs>
    <radialGradient id="ven-fruit" cx="31%" cy="25%" r="82%">
      <stop stop-color="#c7a38a" stop-opacity=".76"/>
      <stop offset=".53" stop-color="#a2785d" stop-opacity=".88"/>
      <stop offset="1" stop-color="#75523f"/>
    </radialGradient>
    <radialGradient id="ven-shadow" cx="27%" cy="21%" r="88%">
      <stop stop-color="#ac8a70"/>
      <stop offset=".55" stop-color="#8b654e"/>
      <stop offset="1" stop-color="#654c3f"/>
    </radialGradient>
    <radialGradient id="ven-bloom" cx="28%" cy="24%" r="87%">
      <stop stop-color="#c2af98" stop-opacity=".88"/>
      <stop offset=".58" stop-color="#a08065"/>
      <stop offset="1" stop-color="#815c45"/>
    </radialGradient>
    <linearGradient id="ven-leaf" x1="79" y1="59" x2="153" y2="157" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4a17d" stop-opacity=".36"/>
      <stop offset=".56" stop-color="#90916c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#737c59" stop-opacity=".65"/>
    </linearGradient>
  </defs>
