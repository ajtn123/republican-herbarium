<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <title>Frimaire — a twig silvered with hoarfrost</title>
  <desc>A bent autumn twig with three curling, toothed leaves and two dried fruits. Fine blue-grey frost needles grow along the bark, leaf margins and veins.</desc>
