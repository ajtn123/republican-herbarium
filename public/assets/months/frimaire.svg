    <linearGradient id="frimaire-bark" x1="119" y1="282" x2="147" y2="283" gradientUnits="userSpaceOnUse"><stop stop-color="#46595a"/><stop offset=".48" stop-color="#829397"/><stop offset="1" stop-color="#51666b"/></linearGradient>
