    <linearGradient id="frimaire-low" x1="197" y1="244" x2="204" y2="285" gradientUnits="userSpaceOnUse"><stop stop-color="#aab8b6" stop-opacity=".3"/><stop offset=".7" stop-color="#829797" stop-opacity=".56"/><stop offset="1" stop-color="#52686c" stop-opacity=".7"/></linearGradient>
