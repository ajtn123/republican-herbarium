<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="ventose-title ventose-desc">
  <title id="ventose-title">Ventôse — willow in a passing wind</title>
  <desc id="ventose-desc">A supple willow spray bends to the right. Its slender twigs carry individually curved, grey-green leaves, with fine veins and a few engraved shadows; two tiny willow seeds drift above it.</desc>
