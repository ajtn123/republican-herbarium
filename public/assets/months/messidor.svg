    <linearGradient id="messidor-grain" x1="12%" y1="20%" x2="92%" y2="78%">
      <stop offset="0" stop-color="#d9c58e"/>
      <stop offset=".48" stop-color="#c4a965"/>
      <stop offset="1" stop-color="#9a7c37"/>
    </linearGradient>
    <linearGradient id="messidor-husk" x1="0" y1="0" x2="1" y2=".6">
      <stop stop-color="#c1ad72" stop-opacity=".68"/>
      <stop offset="1" stop-color="#9a7c37" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="messidor-blade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a59a60" stop-opacity=".75"/>
      <stop offset="1" stop-color="#847644" stop-opacity=".45"/>
    </linearGradient>
  </defs>
