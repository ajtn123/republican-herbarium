<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="messidor-title messidor-desc">
  <title id="messidor-title">获月 · Messidor — ripe wheat</title>
  <desc id="messidor-desc">Three heavy ears of wheat bend above loosely gathered stalks. Unequal, overlapping golden grains, fine awns and a curling blade are drawn in muted ochre and olive-brown engraving lines.</desc>
