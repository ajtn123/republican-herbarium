<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" role="img" aria-labelledby="pluviose-title pluviose-desc">
<title id="pluviose-title">Pluviôse — a willow in the rain</title>
<desc id="pluviose-desc">A supple arching willow bough bears long, curved, lanceolate leaves. Small drops cling to their pointed tips above the uneven ellipses of a rain-disturbed pond. Muted blue-green washes and fine engraved veins.</desc>
<defs>
  <linearGradient id="pluviose-leaf" x1="0" y1="0" x2="1" y2=".3">
    <stop stop-color="#547778" stop-opacity=".12"/>
    <stop offset=".46" stop-color="#547778" stop-opacity=".34"/>
    <stop offset="1" stop-color="#547778" stop-opacity=".17"/>
  </linearGradient>
  <linearGradient id="pluviose-turn" x1="0" y1="0" x2="1" y2=".5">
    <stop stop-color="#547778" stop-opacity=".28"/>
    <stop offset=".55" stop-color="#8a9e94" stop-opacity=".12"/>
    <stop offset="1" stop-color="#547778" stop-opacity=".24"/>
  </linearGradient>
  <radialGradient id="pluviose-water">
    <stop stop-color="#547778" stop-opacity=".12"/>
    <stop offset="1" stop-color="#547778" stop-opacity=".015"/>
  </radialGradient>
