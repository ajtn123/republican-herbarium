    </g>
    <!-- Broken bark follows the slow twist of the trunk. -->
    <g stroke="#344032" stroke-opacity=".65" stroke-width=".65">
      <path d="M107 281C107 270 110 262 108 251M107 242C105 230 107 220 109 214M111 206C114 194 116 187 115 180M113 169C111 158 108 150 107 142M116 166C120 158 124 153 127 148M102 208L96 195M95 190L86 178M110 286L113 291M104 285L99 292M109 273L110 260M106 225L105 215"/>
      <path d="M108 254C112 247 110 239 109 235M107 275C104 269 106 263 107 260M111 199L113 190M114 181L117 174"/>
    </g>
    <path d="M111 230C114 232 113 238 110 240C107 238 108 233 111 230Z" fill="#465044" fill-opacity=".65"/>
    <path d="M108 230C110 228 114 231 114 234" stroke="#344032" stroke-width=".7"/>
  </g>

  <!-- A handful of the last leaves; each still attached to its twig. -->
  <g fill="#6b756c" fill-opacity=".49" stroke="#536052" stroke-width=".7" stroke-linejoin="round">
    <path d="M166 63C170 57 175 56 178 56C178 61 174 65 166 63Z"/>
    <path d="M185 91C187 85 192 81 196 82C196 87 193 92 185 91Z"/>
    <path d="M196 145C201 143 205 145 208 149C203 151 199 150 196 145Z"/>
    <path d="M39 161C35 165 31 166 27 164C29 160 34 158 39 161Z"/>
  </g>

  <!-- Tufted bank and a few broken reflections anchor the visible shore. -->
  <g stroke="#536052" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 294C65 289 74 287 86 289C96 290 103 292 111 293C126 291 133 282 149 280C161 277 177 278 188 274C196 269 193 261 198 254C207 243 222 239 229 235" stroke-width="1.2" stroke-opacity=".7"/>
