  <g mask="url(#br-fog)" stroke="#6b756c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 232C194 215 193 202 190 186C188 174 189 161 185 151M191 192C181 182 176 174 172 161M189 177C197 165 199 154 198 143M193 180C202 179 211 172 215 164M182 177C175 176 168 173 162 165M185 151L182 142M173 164L175 151M199 159C204 153 207 149 207 143M211 169L220 167" stroke-width="1.7"/>
