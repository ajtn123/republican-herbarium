<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <title>Brumaire — orchard in the river mist</title>
  <desc>A gnarled, nearly bare orchard tree stands on a riverbank. Its tapering branches are sharply observed against soft grey-green washes, while smaller trees and the curving riverbank fade into low autumn fog.</desc>
  <defs>
    <linearGradient id="br-ground" x1="136" y1="224" x2="153" y2="319" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b756c" stop-opacity="0"/>
      <stop offset=".48" stop-color="#6b756c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6b756c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="br-river" x1="238" y1="205" x2="256" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b756c" stop-opacity="0"/>
      <stop offset=".7" stop-color="#6b756c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6b756c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="br-haze" cx=".52" cy=".48" r=".55">
      <stop stop-color="#6b756c" stop-opacity=".12"/>
      <stop offset=".64" stop-color="#6b756c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#6b756c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="br-distance" x1="0" y1="143" x2="0" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".52"/>
      <stop offset=".53" stop-color="white" stop-opacity=".26"/>
      <stop offset=".78" stop-color="white" stop-opacity=".04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="br-fog" maskUnits="userSpaceOnUse" x="145" y="110" width="190" height="150">
      <path d="M145 110H335V260H145Z" fill="url(#br-distance)"/>
    </mask>
    <linearGradient id="br-bank-fade" x1="181" y1="246" x2="279" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#465044" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#6b756c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#6b756c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- An open, uneven wash lets the paper itself become the fog. -->
  <path d="M42 207C67 185 97 183 127 190C158 178 177 164 207 168C230 155 266 164 285 182C313 188 332 214 327 239C318 265 281 270 253 265C219 274 183 259 157 267C120 277 91 264 67 253C45 245 32 225 42 207Z" fill="url(#br-haze)"/>
  <path d="M29 285C57 266 78 253 108 253C139 239 171 229 201 227C218 227 234 215 259 214C232 226 212 236 201 245C189 258 196 271 214 282C233 292 250 296 265 312C223 306 191 313 156 311C111 316 66 308 29 285Z" fill="url(#br-ground)"/>
  <path d="M284 208C255 216 236 231 226 243C214 261 234 273 259 281C286 289 306 299 326 314C298 318 276 319 253 313C238 299 211 292 199 278C183 261 196 249 211 239C236 224 255 214 284 208Z" fill="url(#br-river)"/>

