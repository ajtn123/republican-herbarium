    <path d="M76 163C70 162 64 163 57 161C49 159 43 155 38 154" stroke="#465044" stroke-width="1.65"/>
    <path d="M94 184C91 173 93 165 91 156C90 148 86 143 85 137" stroke="#465044" stroke-width="1.5"/>
    <path d="M151 162C162 160 169 156 176 150C183 144 187 137 194 135" stroke="#465044" stroke-width="1.65"/>
    <path d="M168 135C169 125 166 117 169 107C172 97 179 90 180 82" stroke="#465044" stroke-width="1.6"/>
    <path d="M156 111C162 104 167 101 173 100" stroke="#465044" stroke-width="1.2"/>
