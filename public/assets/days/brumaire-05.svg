      <stop offset=".48" stop-color="#eee9d8" stop-opacity=".86"/>
      <stop offset="1" stop-color="#c9cbb8" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="brumaire05-neck" x1="107" y1="104" x2="139" y2="130" gradientUnits="userSpaceOnUse">
