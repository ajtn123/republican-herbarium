<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire05-title brumaire05-desc">
  <title id="brumaire05-title">Brumaire 5 — Oie</title>
  <desc id="brumaire05-desc">A calm white domestic goose stands in left profile. Its small head and short ochre bill crown a long, gently curved upright neck above a deep pear-shaped body. Cream and sage washes, layered folded flight feathers and fine curved hatching describe the plumage. Two short scaled legs end in three-toed webbed feet.</desc>
