      <stop offset="1" stop-color="#e4e2ce" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="brumaire05-wing" x1="175" y1="177" x2="246" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4eedc" stop-opacity=".88"/>
