  <title id="ni02-title">Houille — charbon bitumineux</title>
  <desc id="ni02-desc">An irregular lump of dark bituminous coal and two broken splinters. Dull charcoal layers alternate with softer grey lustrous bands across its fractured faces; intersecting cleats and fine curved engraving reveal the compressed, brittle substance.</desc>
