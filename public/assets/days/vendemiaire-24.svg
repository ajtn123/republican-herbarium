  <linearGradient id="v24-scape" x1="165" y1="198" x2="181" y2="198" gradientUnits="userSpaceOnUse"><stop stop-color="#798469" stop-opacity=".86"/><stop offset=".42" stop-color="#b0b49a" stop-opacity=".76"/><stop offset="1" stop-color="#8e997a" stop-opacity=".86"/></linearGradient>
  <linearGradient id="v24-bulb" x1="147" y1="273" x2="199" y2="304" gradientUnits="userSpaceOnUse"><stop stop-color="#c0a386" stop-opacity=".8"/><stop offset=".43" stop-color="#ab8c6b" stop-opacity=".85"/><stop offset="1" stop-color="#80654e" stop-opacity=".9"/></linearGradient>
  <linearGradient id="v24-leaf" x1="249" y1="274" x2="286" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#778263" stop-opacity=".83"/><stop offset=".48" stop-color="#9da487" stop-opacity=".72"/><stop offset="1" stop-color="#b3b59b" stop-opacity=".64"/></linearGradient>
  <linearGradient id="v24-rose" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#f0e4dc" stop-opacity=".9"/><stop offset=".52" stop-color="#e0c4c4" stop-opacity=".82"/><stop offset="1" stop-color="#c69b9f" stop-opacity=".83"/></linearGradient>
