<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v24-title v24-desc">
<title id="v24-title">Amaryllis — flowering bulb study</title>
<desc id="v24-desc">A belladonna-like amaryllis, illustrative of the historically broad name: three pale rose six-tepalled funnel flowers with long curved stamens rise in a small umbel from a smooth leafless scape. Split papery spathes clasp the flower stalks. Below are a layered brown bulb and fine roots, with a separate strap-leaf study to the right.</desc>
