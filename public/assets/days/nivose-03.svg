    <linearGradient id="nivose-03-pitch" x1="143" y1="125" x2="196" y2="223" gradientUnits="userSpaceOnUse"><stop stop-color="#4c443b"/><stop offset=".38" stop-color="#332e29"/><stop offset="1" stop-color="#24221f"/></linearGradient>
