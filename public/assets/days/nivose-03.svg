<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="nivose-03-title nivose-03-desc">
  <title id="nivose-03-title">Bitume — Bitumen</title>
  <desc id="nivose-03-desc">A natural black-brown bitumen seam coats a broken piece of pale, warm grey limestone. Its rounded adhesive folds and a slow, glossy seep contrast with the fine fractures and rough strata of the mineral host. A small folded fragment of pitch lies below the specimen.</desc>
  <defs>
    <linearGradient id="nivose-03-rock" x1="107" y1="100" x2="236" y2="267" gradientUnits="userSpaceOnUse"><stop stop-color="#d2c8b4" stop-opacity=".77"/><stop offset=".53" stop-color="#bcad94" stop-opacity=".86"/><stop offset="1" stop-color="#a5967e" stop-opacity=".9"/></linearGradient>
    <linearGradient id="nivose-03-front" x1="153" y1="191" x2="149" y2="274" gradientUnits="userSpaceOnUse"><stop stop-color="#cec0a7" stop-opacity=".84"/><stop offset="1" stop-color="#ad9d83" stop-opacity=".9"/></linearGradient>
