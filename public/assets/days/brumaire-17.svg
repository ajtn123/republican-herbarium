<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire-17-title brumaire-17-desc">
<title id="brumaire-17-title">Cresson — Nasturtium officinale</title>
<desc id="brumaire-17-desc">A watercress sprig with pale fleshy branching stems, several pinnate leaves made of rounded oval leaflets and a larger terminal leaflet. Fine adventitious roots trail from the lower stem joints; a small upright raceme carries tiny white four-petalled flowers, green buds and narrow young seed pods. Sage watercolor and fine umber-green engraving lines describe the specimen.</desc>
