    <radialGradient id="frimaire29-black" cx=".31" cy=".22" r=".8"><stop stop-color="#8a8d81"/><stop offset=".35" stop-color="#575d55"/><stop offset="1" stop-color="#343d37"/></radialGradient>
    <linearGradient id="frimaire29-flesh" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#e0d7ae" stop-opacity=".95"/><stop offset=".5" stop-color="#c7c294" stop-opacity=".9"/><stop offset="1" stop-color="#aaa976" stop-opacity=".95"/></linearGradient>
    <linearGradient id="frimaire29-stone" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#c7b28b"/><stop offset=".43" stop-color="#ad9169"/><stop offset="1" stop-color="#8d7656"/></linearGradient>
