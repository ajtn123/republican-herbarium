<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire29-title frimaire29-desc">
  <title id="frimaire29-title">Olive — Olea europaea</title>
  <desc id="frimaire29-desc">A slender olive twig bears opposite pairs of long, narrow, smooth-edged leaves, one turned to reveal its silvery underside. Three oval drupes ripen from green through muted purple to almost black. A separate lengthwise-cut olive exposes pale flesh and an elongated, ridged stone.</desc>
  <defs>
    <linearGradient id="frimaire29-leaf" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#aeb19a" stop-opacity=".66"/><stop offset=".48" stop-color="#8c9976" stop-opacity=".74"/><stop offset="1" stop-color="#6b7b58" stop-opacity=".83"/></linearGradient>
    <linearGradient id="frimaire29-leaf-dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ba68a" stop-opacity=".66"/><stop offset="1" stop-color="#667852" stop-opacity=".88"/></linearGradient>
    <linearGradient id="frimaire29-silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dedfd0" stop-opacity=".8"/><stop offset=".55" stop-color="#bcc4ad" stop-opacity=".75"/><stop offset="1" stop-color="#9ca88e" stop-opacity=".8"/></linearGradient>
    <linearGradient id="frimaire29-twig" x1="157" y1="182" x2="165" y2="184" gradientUnits="userSpaceOnUse"><stop stop-color="#b0a080"/><stop offset=".48" stop-color="#95866b"/><stop offset="1" stop-color="#786c54"/></linearGradient>
    <radialGradient id="frimaire29-green" cx=".31" cy=".25" r=".8"><stop stop-color="#bcc091" stop-opacity=".9"/><stop offset=".48" stop-color="#9aab73" stop-opacity=".95"/><stop offset="1" stop-color="#718252"/></radialGradient>
