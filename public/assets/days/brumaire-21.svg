<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br21-title br21-desc">
  <title id="br21-title">Bacchante — an illustrative Baccharis shrub</title>
  <desc id="br21-desc">An illustrative interpretation of the historical Bacchante group, drawn as a Baccharis halimifolia-like shrub sprig. Slender woody branches carry alternate grey-green wedge-based obovate and rhomboid leaves with a few coarse teeth toward their tips. Loose terminal clusters bear tiny pale tubular composite heads, without showy ray petals, and several silky cream pappus tufts.</desc>
