    <!-- Long tactile whiskers fan from the muzzle in irregular, slender arcs. -->
    <g stroke="#746e5c" stroke-width=".52" opacity=".85">
      <path d="M64 168C54 162 43 160 34 161M63 170C51 167 40 169 32 172M63 172C51 172 42 177 36 181M67 172C56 177 49 183 45 189M75 168C83 161 93 157 102 157M76 170C88 165 100 165 108 168M77 173C87 172 98 176 105 180M75 174C84 177 91 184 95 190"/>
