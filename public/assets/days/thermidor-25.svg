    <path d="M55 164C58 162 62 162 65 163" stroke="#b9b8a3" stroke-width=".75"/>
    <path d="M61 170L61 173C65 176 71 177 76 175M61 173C58 175 54 174 52 173M77 176C84 176 90 173 94 169" stroke-width=".7"/>
    <path d="M76 151C78 148 82 148 85 150C85 153 82 155 79 154Z" fill="#a99b80" stroke-width=".65"/>
