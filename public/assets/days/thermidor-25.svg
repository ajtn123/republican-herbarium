    <path d="M233 153C255 158 265 175 271 195C277 214 282 230 295 242C305 251 316 257 325 261C328 263 328 265 324 266C312 266 298 261 286 254C269 244 255 229 246 213C236 196 230 179 227 165Z" fill="url(#thermidor25-tail)" stroke-width="1.45"/>
