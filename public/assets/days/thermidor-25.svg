<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="thermidor25-title thermidor25-desc">
  <title id="thermidor25-title">Loutre — Lutra lutra</title>
  <desc id="thermidor25-desc">A Eurasian otter walks low to the ground, turning its broad whiskered muzzle towards the viewer. Its long supple body wears a dense dark umber coat above a pale grey-cream throat. Small rounded ears, modest dark eyes, four short articulated limbs with webbed toes, and a long muscular tail tapering from a broad root distinguish the animal. Fine curved engraving follows the short fur beneath restrained transparent watercolor.</desc>
  <defs>
    <linearGradient id="thermidor25-coat" x1="170" y1="126" x2="178" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#897663" stop-opacity=".88"/>
      <stop offset=".46" stop-color="#796653" stop-opacity=".89"/>
      <stop offset="1" stop-color="#655b4d" stop-opacity=".93"/>
    </linearGradient>
    <linearGradient id="thermidor25-tail" x1="250" y1="169" x2="293" y2="257" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75624f" stop-opacity=".94"/>
      <stop offset=".58" stop-color="#82705a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#9b8a70" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="thermidor25-far" x1="190" y1="184" x2="194" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#665b4c" stop-opacity=".96"/>
      <stop offset="1" stop-color="#8a7960" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="thermidor25-throat" x1="73" y1="164" x2="133" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4ceba" stop-opacity=".94"/>
      <stop offset=".5" stop-color="#bfb6a0" stop-opacity=".88"/>
      <stop offset="1" stop-color="#a29378" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="thermidor25-head" x1="75" y1="134" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95816a" stop-opacity=".92"/>
      <stop offset="1" stop-color="#7c705b" stop-opacity=".83"/>
    </linearGradient>
  </defs>
