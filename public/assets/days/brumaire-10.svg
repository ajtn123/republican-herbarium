<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br10-title br10-desc">
  <title id="br10-title">Charrue — animal-drawn walking plough</title>
  <desc id="br10-desc">A late eighteenth-century walking plough seen from the left front. A long oak draft beam ends in a small iron hitch. Two timber handles rise from the joined and braced plough body; a wedged iron coulter descends in front of the low pointed share, while a broad curved iron mouldboard twists upward to turn the cut soil. Pegs, tenons, wrought iron straps and sparse engraved wood grain describe the working construction.</desc>
