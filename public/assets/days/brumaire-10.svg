    <linearGradient id="br10-oak" x1="116" y1="175" x2="123" y2="202" gradientUnits="userSpaceOnUse"><stop stop-color="#c0aa80" stop-opacity=".87"/><stop offset=".45" stop-color="#a88d63" stop-opacity=".9"/><stop offset="1" stop-color="#89734f"/></linearGradient>
    <linearGradient id="br10-handle" x1="244" y1="170" x2="256" y2="181" gradientUnits="userSpaceOnUse"><stop stop-color="#c0a77b"/><stop offset=".48" stop-color="#a28a60"/><stop offset="1" stop-color="#87724f"/></linearGradient>
    <linearGradient id="br10-stock" x1="191" y1="212" x2="234" y2="237" gradientUnits="userSpaceOnUse"><stop stop-color="#b39a6f"/><stop offset=".53" stop-color="#9a825b"/><stop offset="1" stop-color="#77674b"/></linearGradient>
    <linearGradient id="br10-iron" x1="132" y1="218" x2="151" y2="221" gradientUnits="userSpaceOnUse"><stop stop-color="#565951"/><stop offset=".46" stop-color="#7d7e6e"/><stop offset="1" stop-color="#464d46"/></linearGradient>
