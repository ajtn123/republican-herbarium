<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vp11-title vp11-desc">
  <title id="vp11-title">Pomme de terre — Solanum tuberosum</title>
  <desc id="vp11-desc">Three uneven, ochre-skinned potato stem tubers gathered beneath a short compound-leaf sprig. Shallow clustered eyes, small corky scars and a slender broken stolon distinguish the rounded tubers; fine umber hatching describes their earthy skins.</desc>
