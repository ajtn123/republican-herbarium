<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="germinal05-title germinal05-desc">
  <title id="germinal05-title">Germinal 5 — Poule</title>
  <desc id="germinal05-desc">An adult brown farm hen stands quietly in left profile. Her small five-pointed red comb and two short wattles surround a fine horn-coloured beak and amber eye. Golden neck hackles fall over a rounded tawny body with softly barred feathers, an overlapping folded wing and a short upright arch of brown tail feathers. Two scaled ochre legs have three separate forward toes and a small rear toe, each with a pale claw. Fine umber engraving and translucent earthy washes describe the plumage.</desc>
