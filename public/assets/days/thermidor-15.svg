<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="thermidor-15-title thermidor-15-desc">
  <title id="thermidor-15-title">Brebis — adult European ewe</title>
  <desc id="thermidor-15-desc">A hornless ewe stands quietly facing left, her long narrow face turned slightly toward the viewer and her ears extending sideways. A full cream fleece falls in irregular soft locks over a rounded body. Four slender lower legs end in divided hooves; a small udder and a modest hanging woolly tail identify the adult female. Fine umber contours, curved engraving and translucent warm grey watercolor describe the wool and anatomy.</desc>
