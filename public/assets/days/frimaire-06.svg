    <linearGradient id="fm06-leaf" x1=".1" y1=".1" x2=".9" y2="1"><stop stop-color="#b6beb0" stop-opacity=".58"/><stop offset=".48" stop-color="#9cab96" stop-opacity=".68"/><stop offset="1" stop-color="#7e947b" stop-opacity=".78"/></linearGradient>
