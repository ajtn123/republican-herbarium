<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fm06-title fm06-desc">
  <title id="fm06-title">Mâche — Valerianella locusta</title>
  <desc id="fm06-desc">An open basal rosette of corn salad, its smooth spoon-shaped leaves widening to rounded tips, with delicate arched veins and a small fibrous root. A slender opposite-leaved flowering stem forks into little clusters of pale blue-white five-lobed flowers.</desc>
