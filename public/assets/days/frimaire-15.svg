<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-15-title frimaire-15-desc">
  <title id="frimaire-15-title">Chevreuil — Capreolus capreolus</title>
  <desc id="frimaire-15-desc">An adult male European roe deer stands quietly facing left, one fine hind leg resting slightly behind the other. The compact russet-grey body, large leaf-shaped ears, short three-point antlers, black nose, divided hooves and creamy rump patch above an almost invisible tail distinguish this small woodland deer. Fine umber engraving follows the coat over restrained watercolor washes.</desc>
  <defs>
    <linearGradient id="frimaire-15-coat" x1="174" y1="139" x2="199" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4a28c" stop-opacity=".77"/>
      <stop offset=".44" stop-color="#ad9276" stop-opacity=".82"/>
      <stop offset="1" stop-color="#918170" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="frimaire-15-neck" x1="109" y1="116" x2="143" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aa967f" stop-opacity=".83"/>
      <stop offset=".54" stop-color="#a48c72" stop-opacity=".8"/>
      <stop offset="1" stop-color="#857768" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="frimaire-15-far" x1="215" y1="204" x2="225" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a806f" stop-opacity=".9"/>
