      <stop stop-color="#a99a80"/>
      <stop offset=".64" stop-color="#8c7b60"/>
      <stop offset="1" stop-color="#75664f"/>
    </linearGradient>
    <linearGradient id="frimaire-15-cream" x1="271" y1="172" x2="281" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0d7c1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c7baa1" stop-opacity=".84"/>
    </linearGradient>
  </defs>
