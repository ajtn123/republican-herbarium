<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire-02-title brumaire-02-desc">
  <title id="brumaire-02-title">Céleri — Apium graveolens</title>
  <desc id="brumaire-02-desc">A fresh celery plant with long, fleshy, longitudinally grooved pale green leaf stalks spreading from a compact cream-coloured crown and fine fibrous roots. The stalks divide above into airy pinnate leaves with broad, deeply lobed and coarsely toothed leaflets, drawn in sage watercolour with curved veins and light engraving hatches.</desc>
