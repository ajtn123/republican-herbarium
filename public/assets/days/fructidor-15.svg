<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fructidor-15-title fructidor-15-desc">
  <title id="fructidor-15-title">Truite — Salmo trutta</title>
  <desc id="fructidor-15-desc">A freshwater European brown trout in left profile, with a stocky elongated body, olive-brown back, warm ochre-gold sides and a pale cream belly. Uneven dark spots and fewer russet-red spots with pale halos lie above and below its fine lateral line. One soft-rayed dorsal fin, a small fleshy adipose fin, short paired fins and a broad, almost square tail with a shallow notch distinguish this river fish.</desc>
  <defs>
    <linearGradient id="fructidor-15-body" x1="166" y1="144" x2="166" y2="225" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777a5b" stop-opacity=".91"/>
      <stop offset=".29" stop-color="#a69b69" stop-opacity=".84"/>
      <stop offset=".58" stop-color="#c4ac73" stop-opacity=".81"/>
      <stop offset=".83" stop-color="#d3bf90" stop-opacity=".76"/>
      <stop offset="1" stop-color="#e0d5b7" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="fructidor-15-head" x1="75" y1="159" x2="80" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#938e66" stop-opacity=".56"/>
      <stop offset=".48" stop-color="#c2ad7a" stop-opacity=".51"/>
      <stop offset="1" stop-color="#d6c69e" stop-opacity=".63"/>
    </linearGradient>
    <linearGradient id="fructidor-15-fin" x1="162" y1="117" x2="182" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a8c6a" stop-opacity=".73"/>
      <stop offset=".47" stop-color="#a29b72" stop-opacity=".7"/>
      <stop offset="1" stop-color="#b7a57a" stop-opacity=".73"/>
    </linearGradient>
    <linearGradient id="fructidor-15-tail" x1="273" y1="183" x2="325" y2="185" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d906b" stop-opacity=".86"/>
      <stop offset="1" stop-color="#aea57d" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="fructidor-15-pectoral" x1="102" y1="194" x2="144" y2="223" gradientUnits="userSpaceOnUse">
      <stop stop-color="#958a62" stop-opacity=".91"/>
      <stop offset="1" stop-color="#c1ad82" stop-opacity=".76"/>
    </linearGradient>
  </defs>
