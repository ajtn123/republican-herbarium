<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-10-title frimaire-10-desc">
  <title id="frimaire-10-title">Pioche — digging pick</title>
  <desc id="frimaire-10-desc">An eighteenth-century digging pick, set obliquely across the plate. Its long, gently bowed oak haft passes through the oval eye of a hand-forged iron head. One arm curves into a long sharp point; the shorter arm ends in a narrow, worn chisel. Fine grain, a wooden wedge, dark forged facets and restrained curved hatching describe the used tool.</desc>
