    <linearGradient id="frimaire-10-oak" x1="-14" y1="100" x2="8" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#8e7956" stop-opacity=".94"/><stop offset=".25" stop-color="#b4a079" stop-opacity=".88"/><stop offset=".54" stop-color="#c2ad85" stop-opacity=".83"/><stop offset=".83" stop-color="#aa946a" stop-opacity=".9"/><stop offset="1" stop-color="#86734f" stop-opacity=".95"/></linearGradient>
    <linearGradient id="frimaire-10-iron" x1="-58" y1="-11" x2="-55" y2="25" gradientUnits="userSpaceOnUse"><stop stop-color="#858475" stop-opacity=".93"/><stop offset=".37" stop-color="#737569"/><stop offset=".69" stop-color="#64695d"/><stop offset="1" stop-color="#50594c"/></linearGradient>
    <linearGradient id="frimaire-10-eye" x1="-18" y1="6" x2="19" y2="10" gradientUnits="userSpaceOnUse"><stop stop-color="#51594d"/><stop offset=".45" stop-color="#77786a"/><stop offset=".7" stop-color="#808173"/><stop offset="1" stop-color="#565d50"/></linearGradient>
    <linearGradient id="frimaire-10-bevel" x1="86" y1="17" x2="102" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#939385"/><stop offset="1" stop-color="#b4b09a"/></linearGradient>
