      <stop stop-color="#887453" stop-opacity=".95"/><stop offset=".25" stop-color="#b09b72" stop-opacity=".92"/><stop offset=".57" stop-color="#c7b28a" stop-opacity=".86"/><stop offset=".84" stop-color="#b4a07a" stop-opacity=".91"/><stop offset="1" stop-color="#8c7956" stop-opacity=".96"/>
    </linearGradient>
