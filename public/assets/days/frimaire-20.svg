<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-20-title frimaire-20-desc">
  <title id="frimaire-20-title">Hoyau — broad-bladed mattock</title>
  <desc id="frimaire-20-desc">An illustrative late-eighteenth-century hoyau, a hand-forged mattock for breaking soil and cutting roots. A broad, flared transverse hoe blade is shown obliquely, its worn cutting edge spreading far beyond the narrow neck. A short curved pick balances the opposite side of the iron eye. A gently bowed oak haft passes through the eye and is wedged at its projecting end. Muted iron washes, irregular forging marks and fine oak grain describe a used rural tool; historical forms varied.</desc>
