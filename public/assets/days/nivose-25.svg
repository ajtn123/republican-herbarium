<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="nivose-25-title nivose-25-desc">
  <title id="nivose-25-title">Chat — Felis catus</title>
  <desc id="nivose-25-desc">An adult rustic grey and umber tabby sits quietly in three-quarter profile, watching toward the left. Pointed furred ears, a small wedge-shaped nose, restrained almond eyes and fine sweeping whiskers distinguish its face. A long curved ringed tail rests beside the rounded haunch; two straight forelegs end in small separate paws. Fine engraved fur follows the muted watercolor coat and irregular mackerel stripes.</desc>
