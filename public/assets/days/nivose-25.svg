    <linearGradient id="nivose-25-coat" x1="155" y1="142" x2="250" y2="289" gradientUnits="userSpaceOnUse"><stop stop-color="#b4afa1" stop-opacity=".78"/><stop offset=".46" stop-color="#9b988b" stop-opacity=".83"/><stop offset="1" stop-color="#8d8676" stop-opacity=".88"/></linearGradient>
    <linearGradient id="nivose-25-head" x1="121" y1="77" x2="155" y2="148" gradientUnits="userSpaceOnUse"><stop stop-color="#b5b1a0" stop-opacity=".85"/><stop offset="1" stop-color="#9b9481" stop-opacity=".86"/></linearGradient>
