    <linearGradient id="vc04-right" x1="203" y1="76" x2="139" y2="151" gradientUnits="userSpaceOnUse"><stop stop-color="#e6d8e2"/><stop offset=".61" stop-color="#d4b9cf"/><stop offset="1" stop-color="#ae8da9"/></linearGradient>
