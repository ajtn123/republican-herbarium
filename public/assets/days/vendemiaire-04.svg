    <linearGradient id="vc04-rear" x1="127" y1="47" x2="138" y2="153" gradientUnits="userSpaceOnUse"><stop stop-color="#e4d5df"/><stop offset=".62" stop-color="#d2b8cd"/><stop offset="1" stop-color="#ad8ca9"/></linearGradient>
