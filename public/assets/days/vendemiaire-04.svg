<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Colchique — Colchicum autumnale</title>
  <desc>Two leafless autumn colchicum flowers rise on long, gently bent pale tubes from a small brown corm. Six elongated pink-lilac tepals surround six yellow anthers in the open flower; a smaller bloom is seen obliquely. Fine warm grey veins and restrained violet washes recall a botanical engraving.</desc>
