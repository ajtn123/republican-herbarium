<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="cuve-title cuve-desc">
  <title id="cuve-title">Cuve — an open winemaking vat</title>
  <desc id="cuve-desc">A large upright fermentation vat assembled from slightly tapered oak staves, bound by three worn iron hoops. Its thick elliptical open rim reveals the shaded inner wood and a low surface of purple grape must. Fine grain, stave joints and hand-cut hatching describe the warm umber vessel.</desc>
