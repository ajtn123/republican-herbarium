<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire-12-title brumaire-12-desc">
  <title id="brumaire-12-title">Macre — Trapa natans</title>
  <desc id="brumaire-12-desc">A floating rosette of diamond-shaped, sharply toothed water-caltrop leaves, each carried on a swollen, buoyant petiole. A short submerged stem bears fine branching roots. Beside the specimen lies a dark woody fruit with four spreading pointed horns.</desc>
