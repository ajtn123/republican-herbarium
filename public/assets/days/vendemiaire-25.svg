<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v25-title v25-desc">
  <title id="v25-title">Vendémiaire 25 — Bœuf</title>
  <desc id="v25-desc">A calm adult working ox stands facing left, its heavy warm grey-brown barrel carried on four sturdy legs with split hooves. Modest curved horns, broad pale muzzle, loose folded dewlap and a long tufted tail distinguish the bovine. A simple weathered wooden yoke lies across the shoulders. Fine curved engraving follows the shoulder, ribs and haunch.</desc>
