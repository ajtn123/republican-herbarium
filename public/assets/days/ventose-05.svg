<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="ventose-05-title ventose-05-desc">
  <title id="ventose-05-title">Bouc — Capra hircus</title>
  <desc id="ventose-05-desc">An adult male domestic goat stands facing left, with a lean grey-brown and cream body, muscular neck, long narrow face and a conspicuous pointed beard. Two ridged horns sweep upward and backward without forming a spiral. Short sideways ears, a raised short tail and four divided dark hooves complete the specimen. Fine warm umber engraving follows the coarse coat over quiet translucent watercolor.</desc>
