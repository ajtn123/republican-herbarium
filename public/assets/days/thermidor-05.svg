<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="thermidor-05-title thermidor-05-desc">
  <title id="thermidor-05-title">Bélier — Ovis aries</title>
  <desc id="thermidor-05-desc">An adult European ram stands in a quiet three-quarter side view facing left. Massive ridged horns coil beside his long bare sheep face. His deep chest, strong neck and rounded body carry thick cream and grey-ochre wool, engraved as irregular folded locks. Four sturdy legs end in paired dark claws; a modest woolly tail hangs at the rump.</desc>
