<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire21-title frimaire21-desc">
  <title id="frimaire21-title">Érable sucré — Acer saccharum</title>
  <desc id="frimaire21-desc">A slender sugar maple twig with a broad sage green leaf, five unequal palmate lobes, rounded sinuses and pale branching veins. A smaller ochre autumn leaf turns to the right; two papery winged samaras hang below the opposite side of the twig.</desc>
