    <linearGradient id="frimaire21-leaf" x1="104" y1="55" x2="196" y2="208" gradientUnits="userSpaceOnUse"><stop stop-color="#b2b79a" stop-opacity=".66"/><stop offset=".49" stop-color="#96a183" stop-opacity=".75"/><stop offset="1" stop-color="#7b8969" stop-opacity=".81"/></linearGradient>
