<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br26-title br26-desc">
  <title id="br26-title">Pistache — Pistacia vera</title>
  <desc id="br26-desc">A pistachio twig bearing two leaves, each divided into three broad, smooth-edged oval leaflets, and an open spray of pink and ochre oval fruit hulls. Below the twig lie two cream hard shells split along their natural seams to reveal muted green kernels, and a single shelled kernel with remnants of its violet skin. Fine curved hatching describes the shell grain.</desc>
