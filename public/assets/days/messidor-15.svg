    <linearGradient id="messidor-15-horn" x1="249" y1="70" x2="259" y2="115" gradientUnits="userSpaceOnUse"><stop stop-color="#45483e"/><stop offset=".5" stop-color="#535348"/><stop offset="1" stop-color="#6a604c"/></linearGradient>
  </defs>
