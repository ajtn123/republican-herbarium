<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="messidor-15-title messidor-15-desc">
  <title id="messidor-15-title">Chamois — Rupicapra rupicapra</title>
  <desc id="messidor-15-desc">A European chamois stands alert, facing right on a slight rocky foothold. Its lithe tawny body, short dark tail, dark slender legs and four divided hooves are engraved with fine umber strokes. Two slim black horns rise nearly straight and hook sharply backward only at their tips. A cream forehead and cheek are divided by the characteristic dark stripe passing from the ear through the small eye toward the muzzle.</desc>
  <defs>
    <linearGradient id="messidor-15-coat" x1="165" y1="149" x2="178" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#aa8863" stop-opacity=".79"/><stop offset=".43" stop-color="#b59a76" stop-opacity=".79"/><stop offset="1" stop-color="#87755c" stop-opacity=".88"/></linearGradient>
    <linearGradient id="messidor-15-neck" x1="252" y1="125" x2="217" y2="219" gradientUnits="userSpaceOnUse"><stop stop-color="#a38662" stop-opacity=".86"/><stop offset=".56" stop-color="#9b7f5b" stop-opacity=".77"/><stop offset="1" stop-color="#746650" stop-opacity=".88"/></linearGradient>
    <linearGradient id="messidor-15-leg" x1="167" y1="212" x2="172" y2="305" gradientUnits="userSpaceOnUse"><stop stop-color="#73644f" stop-opacity=".92"/><stop offset=".58" stop-color="#655f50" stop-opacity=".95"/><stop offset="1" stop-color="#494b42" stop-opacity=".94"/></linearGradient>
    <linearGradient id="messidor-15-far" x1="174" y1="209" x2="186" y2="306" gradientUnits="userSpaceOnUse"><stop stop-color="#7d725e" stop-opacity=".89"/><stop offset="1" stop-color="#666655" stop-opacity=".91"/></linearGradient>
