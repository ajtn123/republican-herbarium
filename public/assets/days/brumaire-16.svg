<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire16-title brumaire16-desc">
  <title id="brumaire16-title">Chervis — Sium sisarum</title>
  <desc id="brumaire16-desc">An uprooted skirret plant: a small knotted crown bears a bundle of numerous slender, ivory fleshy roots of unequal length, each tapering to a fine tip and carrying delicate lateral root hairs. Two modest pinnate leaves have sharply serrated oval leaflets, olive veins and translucent sage washes.</desc>
