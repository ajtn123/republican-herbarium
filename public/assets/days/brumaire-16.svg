    <linearGradient id="brumaire16-root" x1="151" y1="207" x2="212" y2="281" gradientUnits="userSpaceOnUse"><stop stop-color="#e5dbc0" stop-opacity=".85"/><stop offset=".42" stop-color="#f0e7cf" stop-opacity=".85"/><stop offset="1" stop-color="#b9a780" stop-opacity=".82"/></linearGradient>
    <linearGradient id="brumaire16-front" x1="171" y1="188" x2="192" y2="299" gradientUnits="userSpaceOnUse"><stop stop-color="#d6c7a3" stop-opacity=".9"/><stop offset=".34" stop-color="#f1e7ce" stop-opacity=".9"/><stop offset=".75" stop-color="#e7dac0" stop-opacity=".9"/><stop offset="1" stop-color="#baa580" stop-opacity=".85"/></linearGradient>
