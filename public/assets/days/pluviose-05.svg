<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pluviose05-title pluviose05-desc">
  <title id="pluviose05-title">Pluviôse 5 — Taureau</title>
  <desc id="pluviose05-desc">A calm, intact adult European bull stands facing right with his broad forehead slightly lowered. His compact chestnut body, very powerful neck and shoulders, short upward-curving ivory horns, modest dewlap, four sturdy legs with divided hooves and a dark tufted tail are drawn in fine umber engraving beneath muted translucent watercolor.</desc>
  <defs>
    <linearGradient id="pluviose05-coat" x1="145" y1="125" x2="155" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ac8766" stop-opacity=".8"/>
      <stop offset=".48" stop-color="#947052" stop-opacity=".84"/>
      <stop offset="1" stop-color="#785640" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="pluviose05-neck" x1="218" y1="126" x2="255" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c684e" stop-opacity=".91"/>
      <stop offset=".55" stop-color="#76513e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#654936" stop-opacity=".93"/>
    </linearGradient>
    <linearGradient id="pluviose05-far" x1="176" y1="215" x2="176" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c513e" stop-opacity=".94"/>
      <stop offset="1" stop-color="#8a6c51" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="pluviose05-head" x1="270" y1="151" x2="287" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77533e" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#916b4d" stop-opacity=".93"/>
      <stop offset="1" stop-color="#74533e" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="pluviose05-horn" x1="271" y1="125" x2="273" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2987f" stop-opacity=".96"/>
      <stop offset=".25" stop-color="#d6cbb0" stop-opacity=".96"/>
      <stop offset=".72" stop-color="#c0ae8d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9b8766" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="pluviose05-nose" x1="294" y1="200" x2="292" y2="225" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a79478" stop-opacity=".96"/>
      <stop offset="1" stop-color="#8a7860" stop-opacity=".97"/>
    </linearGradient>
  </defs>
