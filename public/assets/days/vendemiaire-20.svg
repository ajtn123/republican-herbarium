<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pres20-title pres20-desc">
  <title id="pres20-title">Pressoir — upright screw wine press</title>
  <desc id="pres20-desc">An old wooden wine press with two massive pegged uprights and a heavy crossbeam. A central threaded spindle, turned with a long hand bar, bears through its foot onto a round pressing plate within a staved grape basket. The basket stands on a grooved drainage bed with a short spout and one small drop of juice. Worn oak, dark iron and fine grain are drawn in muted umber and olive.</desc>
