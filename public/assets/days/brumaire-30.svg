    <linearGradient id="br30-shaft" x1="137" y1="98" x2="151" y2="99" gradientUnits="userSpaceOnUse"><stop stop-color="#a08b63"/><stop offset=".38" stop-color="#b6a17b"/><stop offset="1" stop-color="#857553"/></linearGradient>
