<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br30-title br30-desc">
  <title id="br30-title">Rouleau — stone field roller</title>
  <desc id="br30-desc">An eighteenth-century agricultural roller viewed obliquely. One massive solid stone cylinder turns on a through axle, carried in two iron-lined bearings at the ends of a pegged oak frame. Two long wooden tow shafts extend forward from its crossbeam. The round exposed stone end, gently worn rolling surface, axle collars, tenons and fine engraved marks show its construction.</desc>
