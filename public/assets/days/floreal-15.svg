<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="floreal15-title floreal15-desc">
  <title id="floreal15-title">Ver à soie — Bombyx mori</title>
  <desc id="floreal15-desc">A plump ivory domestic silkworm curves gently across a serrated, heart-based mulberry leaf. A small tawny head precedes three pairs of short jointed thoracic legs. Four pairs of soft abdominal prolegs and a terminal anal pair grip the leaf; a small horn rises from the eighth abdominal segment. Fine curved folds, minute lateral spiracles and a muted cream wash describe the larva. A single pale oval silk cocoon lies nearby.</desc>
  <defs>
    <linearGradient id="floreal15-leaf" x1="140" y1="117" x2="221" y2="283" gradientUnits="userSpaceOnUse"><stop stop-color="#b2b79b" stop-opacity=".68"/><stop offset=".48" stop-color="#96a183" stop-opacity=".72"/><stop offset="1" stop-color="#7e8d6c" stop-opacity=".8"/></linearGradient>
    <linearGradient id="floreal15-larva" x1="186" y1="132" x2="173" y2="202" gradientUnits="userSpaceOnUse"><stop stop-color="#f8f3e6"/><stop offset=".44" stop-color="#f0ead9"/><stop offset=".75" stop-color="#e3ddc9"/><stop offset="1" stop-color="#c7c2aa"/></linearGradient>
    <linearGradient id="floreal15-proleg" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#e8e1cc"/><stop offset=".6" stop-color="#d8d1b9"/><stop offset="1" stop-color="#b6b198"/></linearGradient>
    <linearGradient id="floreal15-head" x1="80" y1="145" x2="96" y2="168" gradientUnits="userSpaceOnUse"><stop stop-color="#ceb997"/><stop offset=".5" stop-color="#b49b76"/><stop offset="1" stop-color="#92795b"/></linearGradient>
