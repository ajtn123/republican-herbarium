<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="nivose-15-title nivose-15-desc">
  <title id="nivose-15-title">Lapin — Oryctolagus cuniculus domesticus</title>
  <desc id="nivose-15-desc">An adult grey-brown domestic European rabbit crouches quietly in left profile. Its compact back rises into a full rounded haunch, the short forelegs rest on furred paws, and a small cream cotton tail peeps from the rump. Two moderately short rounded ears have softly pink inner surfaces without black tips. Fine whiskers, a small brown eye, a divided upper lip and curved fur engraving accompany translucent warm grey watercolor.</desc>
  <defs>
    <linearGradient id="nivose-15-coat" x1="174" y1="153" x2="218" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5afa0" stop-opacity=".79"/>
      <stop offset=".46" stop-color="#a49a87" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8e8371" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="nivose-15-haunch" x1="224" y1="201" x2="262" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5ac97" stop-opacity=".14"/>
      <stop offset=".58" stop-color="#9d927d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7f7564" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="nivose-15-head" x1="99" y1="144" x2="121" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5ac97" stop-opacity=".87"/>
      <stop offset=".52" stop-color="#a59a85" stop-opacity=".88"/>
      <stop offset="1" stop-color="#c6baa0" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="nivose-15-ear" x1="113" y1="80" x2="128" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9ad95" stop-opacity=".89"/>
      <stop offset="1" stop-color="#998d76" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="nivose-15-inner-ear" x1="112" y1="90" x2="127" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c2a99b" stop-opacity=".66"/>
      <stop offset="1" stop-color="#a68d7f" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="nivose-15-cream" x1="133" y1="201" x2="145" y2="287" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dfd5be" stop-opacity=".89"/>
      <stop offset="1" stop-color="#c9bea6" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="nivose-15-far" x1="121" y1="231" x2="133" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#958b78" stop-opacity=".92"/>
      <stop offset="1" stop-color="#b1a58c" stop-opacity=".9"/>
    </linearGradient>
  </defs>
