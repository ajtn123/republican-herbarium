    <path d="M241 211C264 212 280 231 279 251C279 266 269 277 258 283C251 288 240 289 229 288L206 288C198 288 190 291 190 296C191 300 200 301 208 300L247 299C263 299 274 292 280 281" fill="url(#nivose-15-coat)" stroke-width="1.25"/>
