<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire-03-title brumaire-03-desc">
  <title id="brumaire-03-title">Poire — Pyrus communis</title>
  <desc id="brumaire-03-desc">An orchard pear branch bears two unequal yellow and olive russet pears on slender curved woody stalks. The larger fruit has a long narrow neck and an uneven, full lower body. Finely serrated oval leaves show branching veins; sparse russet lenticels and curved engraved hatching describe the fruit skins.</desc>
