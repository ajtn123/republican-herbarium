<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br04-title br04-desc">
  <title id="br04-title">Betterave — Beta vulgaris</title>
  <desc id="br04-desc">A freshly lifted red beet, its round wine-red storage root narrowing into a long curved taproot with fine lateral rootlets. Upright ribbed crimson petioles carry broad, wavy and puckered green leaves with red branching veins. A small cut slice shows the beet's subtle concentric red rings.</desc>
