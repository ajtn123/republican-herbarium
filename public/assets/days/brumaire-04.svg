    <linearGradient id="br04-leaf" x1="84" y1="54" x2="175" y2="178" gradientUnits="userSpaceOnUse"><stop stop-color="#acb096" stop-opacity=".66"/><stop offset=".48" stop-color="#8e9b78" stop-opacity=".75"/><stop offset="1" stop-color="#6d805e" stop-opacity=".82"/></linearGradient>
