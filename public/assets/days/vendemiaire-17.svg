<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v17-title v17-desc">
  <title id="v17-title">Citrouille — Cucurbita pepo</title>
  <desc id="v17-desc">A round orange pumpkin with unequal, strongly marked vertical ribs, a little weathering on its rind, and a stout five-ridged stalk with a dry angular cut. One slender tendril curls beside the stalk. Restrained ochre-orange washes and fine umber engraving describe a representative pumpkin of the broad historic name Citrouille.</desc>
