      <stop stop-color="#afa18c" stop-opacity=".71"/>
      <stop offset=".47" stop-color="#a18b71" stop-opacity=".77"/>
      <stop offset="1" stop-color="#85765f" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="messidor05-far" x1="186" y1="209" x2="196" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#857762" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a09278" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="messidor05-ear" x1="256" y1="63" x2="257" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4a58b" stop-opacity=".83"/>
      <stop offset="1" stop-color="#92816b" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="messidor05-muzzle" x1="291" y1="137" x2="293" y2="165" gradientUnits="userSpaceOnUse">
