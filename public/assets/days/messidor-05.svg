<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="messidor05-title messidor05-desc">
  <title id="messidor05-title">Messidor 5 — Mulet</title>
  <desc id="messidor05-desc">An adult rural mule stands facing right, its strong horse-shaped barrel and substantial limbs balanced beneath a high sloping neck. The lean head carries moderately long upright ears, a pale muzzle and a short dark standing mane. Four single hooves, a sparse tail with a dark terminal brush, and fine curved umber engraving distinguish the quiet grey-bay animal, shown without harness.</desc>
