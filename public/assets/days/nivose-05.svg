    <linearGradient id="nivose05-coat" x1="168" y1="110" x2="198" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7a58c" stop-opacity=".83"/>
      <stop offset=".47" stop-color="#b39c79" stop-opacity=".83"/>
      <stop offset="1" stop-color="#9b896d" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="nivose05-far" x1="204" y1="207" x2="209" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c8170" stop-opacity=".91"/>
      <stop offset="1" stop-color="#b5aa91" stop-opacity=".9"/>
    </linearGradient>
