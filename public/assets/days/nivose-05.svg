<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="nivose05-title nivose05-desc">
  <title id="nivose05-title">Nivôse 5 — Chien</title>
  <desc id="nivose05-desc">A calm adult rural working dog stands facing left, with a proportionate broad muzzle, small alert brown eye and softly folded ears. Its short warm grey-tan coat shades into a cream throat, belly and four connected legs ending in rounded, separately engraved toes. A long relaxed tail curves down beside the haunch. Fine umber hatching follows the shoulder, ribs, muscular thigh and lay of the hair beneath muted translucent watercolor.</desc>
