<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="germinal25-title germinal25-desc">
  <title id="germinal25-title">Germinal 25 — Pigeon</title>
  <desc id="germinal25-desc">A domestic rock pigeon in left profile, with a small slate head, short bill and pale cere, rounded breast, and a faint sage and dusty rose sheen on the neck. Overlapping grey wing feathers carry two distinct charcoal bars. A slate tail has a dark terminal band. Two red-umber scaled legs end in separate jointed toes and small claws. Fine curved engraving marks follow the plumage beneath translucent grey watercolor washes.</desc>
