<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-01-title frimaire-01-desc">
  <title id="frimaire-01-title">Raiponce — Campanula rapunculus</title>
  <desc id="frimaire-01-desc">An uprooted rampion bellflower, with a slender ivory swollen taproot and fine side roots, a loose rosette of long lanceolate leaves and a wiry stalk carrying small lilac blue bells. The five pointed lobes open from long fused corolla tubes above narrow green calyx teeth.</desc>
