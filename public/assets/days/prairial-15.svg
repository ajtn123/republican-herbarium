<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="prairial15-title prairial15-desc">
<title id="prairial15-title">Prairial 15 — Caille</title>
<desc id="prairial15-desc">A common quail stands low in left profile, its compact rounded body clothed in warm buff and umber feathers with narrow cream shaft streaks and irregular dark mottles. A pale eyebrow crosses the small striped head above a brown eye; modest dark marks border the cream throat. Its folded pointed wing almost conceals the very short tail. Two short, sturdy, scaled legs end in separate natural clawed toes. Translucent earth-coloured washes and fine curved engraving describe the plumage.</desc>
