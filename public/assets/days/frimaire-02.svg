<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-02-title frimaire-02-desc">
  <title id="frimaire-02-title">Turneps — an old fodder-turnip form · 饲用芜菁</title>
  <desc id="frimaire-02-desc">An illustrative old fodder-turnip form, freshly lifted: a substantial elongated cream and earthy ochre storage root with a muted green-violet shoulder, a thick rough-leaved crown, a narrowing lower root and fine torn root hairs. Unequal rounded and pointed leaf lobes, branching veins and curved engraved hatching describe the coarse foliage and swollen root without assigning a particular historical cultivar.</desc>
