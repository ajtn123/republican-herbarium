      <stop stop-color="#b9a782" stop-opacity=".82"/><stop offset=".2" stop-color="#e1d5b6" stop-opacity=".82"/><stop offset=".48" stop-color="#f0e8d0" stop-opacity=".78"/><stop offset=".72" stop-color="#e4d8b9" stop-opacity=".8"/><stop offset="1" stop-color="#b8a27b" stop-opacity=".85"/>
    </linearGradient>
