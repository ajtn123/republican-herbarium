    <linearGradient id="frimaire-16-green" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#a5ad8b" stop-opacity=".78"/><stop offset=".5" stop-color="#879575" stop-opacity=".83"/><stop offset="1" stop-color="#6c7b59" stop-opacity=".88"/></linearGradient>
