<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-16-title frimaire-16-desc">
  <title id="frimaire-16-title">Ajonc — Ulex europaeus</title>
  <desc id="frimaire-16-desc">A woody sprig of common gorse, with densely divided, rigid green spines and only a few small linear leaves. Warm golden pea flowers show a broad upright standard, folded wings and a boat-shaped keel among the thorny shoots. A short dark hairy pod hangs below the lower flowers.</desc>
