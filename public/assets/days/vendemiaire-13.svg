<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vp13-title vp13-desc">
  <title id="vp13-title">Potiron — courge gris-bleu</title>
  <desc id="vp13-desc">A heavy, flattened blue-grey pumpkin, suggestive of a Cucurbita maxima type, with broad unequal ribs, a sunken crown and a short rounded corky stalk. Muted sage and grey washes and fine olive engraving describe its matte, weathered rind. The old crop name is broader than a single modern species.</desc>
