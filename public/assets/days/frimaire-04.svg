<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire-04-title frimaire-04-desc">
  <title id="frimaire-04-title">Nèfle — Mespilus germanica</title>
  <desc id="frimaire-04-desc">A slender engraved medlar twig bears two small matte russet fruits, one darkening with bletting. Their unusually wide, open blossom-end cups are surrounded by five long persistent pointed calyx lobes. Finely toothed obovate leaves show curved lateral veins through a muted sage wash.</desc>
  <defs>
    <linearGradient id="frimaire-04-wood" x1="148" y1="210" x2="161" y2="214" gradientUnits="userSpaceOnUse"><stop stop-color="#b4a188"/><stop offset=".48" stop-color="#99866b"/><stop offset="1" stop-color="#78674f"/></linearGradient>
    <linearGradient id="frimaire-04-leaf" x1="-19" y1="-78" x2="18" y2="-10" gradientUnits="userSpaceOnUse"><stop stop-color="#a8ad8f" stop-opacity=".62"/><stop offset=".48" stop-color="#98a17e" stop-opacity=".69"/><stop offset="1" stop-color="#7e8b68" stop-opacity=".78"/></linearGradient>
