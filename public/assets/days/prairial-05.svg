<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="prairial05-title prairial05-desc">
<title id="prairial05-title">Prairial 5 — Canard</title>
<desc id="prairial05-desc">A female domestic mallard duck stands in a quiet left-facing three-quarter profile. Her low, broad body and short curved neck carry warm brown and buff mottled feathers. A dark eye stripe crosses her pale cheek above a broad flattened ochre bill. Individually layered brown wing feathers surround a small muted sage-grey speculum, and a short pointed tail and two ochre webbed feet complete the specimen. Fine umber engraving and transparent watercolor washes describe the plumage.</desc>
