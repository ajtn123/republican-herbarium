    <linearGradient id="frimaire18-leaf" x1="-.5" y1="0" x2=".8" y2="1"><stop stop-color="#b2b69b" stop-opacity=".62"/><stop offset=".52" stop-color="#8c9a79" stop-opacity=".73"/><stop offset="1" stop-color="#65765a" stop-opacity=".83"/></linearGradient>
