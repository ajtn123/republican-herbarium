<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire18-title frimaire18-desc">
  <title id="frimaire18-title">Lierre — Hedera helix</title>
  <desc id="frimaire18-desc">A woody climbing ivy sprig bears small brown clinging rootlets and alternate angular five-lobed juvenile leaves, each with pale palmate veins. Above them an adult flowering shoot has simple entire oval leaves and a spreading umbel of dark ripe berries.</desc>
