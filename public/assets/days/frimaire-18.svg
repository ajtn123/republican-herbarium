    <radialGradient id="frimaire18-berry" cx=".33" cy=".26" r=".77"><stop stop-color="#7b7b69"/><stop offset=".36" stop-color="#575b50"/><stop offset="1" stop-color="#353e37"/></radialGradient>
  </defs>
