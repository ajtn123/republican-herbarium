    <linearGradient id="vn23-leaf-low" x1="59" y1="126" x2="160" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4aa87" stop-opacity=".68"/><stop offset="1" stop-color="#7a8861" stop-opacity=".78"/>
    </linearGradient>
  </defs>
