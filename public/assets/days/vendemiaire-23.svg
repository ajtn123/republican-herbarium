<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vn23-title vn23-desc">
  <title id="vn23-title">Navet — Brassica rapa</title>
  <desc id="vn23-desc">An uneven, squat white turnip with a muted violet shoulder, a fine curving taproot and a loose crown of rough, lyrate green leaves. Irregular rounded leaf lobes, branching veins and delicate curved root hatching describe the freshly lifted botanical specimen.</desc>
  <defs>
    <linearGradient id="vn23-root" x1="135" y1="187" x2="220" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2ead9" stop-opacity=".84"/><stop offset=".45" stop-color="#eee6d4" stop-opacity=".71"/><stop offset=".78" stop-color="#e0d5bd" stop-opacity=".78"/><stop offset="1" stop-color="#baa98b" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="vn23-shoulder" x1="180" y1="179" x2="182" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#887080" stop-opacity=".74"/><stop offset=".47" stop-color="#a28a99" stop-opacity=".66"/><stop offset="1" stop-color="#b6a3ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vn23-leaf" x1="111" y1="53" x2="179" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a6ad8d" stop-opacity=".64"/><stop offset=".5" stop-color="#8e9b73" stop-opacity=".76"/><stop offset="1" stop-color="#758461" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="vn23-leaf-right" x1="284" y1="70" x2="204" y2="172" gradientUnits="userSpaceOnUse">
