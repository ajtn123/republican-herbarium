      <path d="M-2.8-12.5C-2.8-7.7-2.1-3.5-.7-.3M-.7-13.5L-.2-.4M1.5-13.5C2-9.5 1.7-4.4.7-.2M3-12.7C3.2-8.5 2.4-4.4 1.5-2" stroke="#7d8964" stroke-width=".5"/>
