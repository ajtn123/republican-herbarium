      <path d="M-1.2-28.7Q-.2-27.6 1-28.6" stroke="#f5ede7" stroke-width=".55"/>
    </g>
    <g id="br18-bud-form">
      <path d="M-1.8-10.6C-2.5-15.4-3.6-19.6-1.5-25.5C1.5-23.1 3.3-18.8 2-11.1Z" fill="url(#br18-bud)" stroke="#a89b9b" stroke-width=".7"/>
      <path d="M-1.5-24C-.6-20.1.5-15.3.2-12M-1.2-20.5L1.2-18.5" stroke="#b29da9" stroke-width=".5"/>
      <use href="#br18-calyx-form"/>
    </g>
