<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br18-title br18-desc">
  <title id="br18-title">Dentelaire — Plumbago europaea</title>
  <desc id="br18-desc">A slender, loosely branched dentelaire specimen with alternate oblong entire leaves and scattered pale rose-lilac five-lobed flowers. Long narrow corolla tubes rise from green five-ribbed calyces clothed in fine sticky glandular hairs; pointed buds and a few spent calyces remain on the terminal sprays.</desc>
