    <linearGradient id="br18-stem" x1="174" y1="230" x2="180" y2="231" gradientUnits="userSpaceOnUse"><stop stop-color="#b2b292"/><stop offset=".5" stop-color="#939a77"/><stop offset="1" stop-color="#788363"/></linearGradient>
    <linearGradient id="br18-leaf" x1="97" y1="190" x2="220" y2="294" gradientUnits="userSpaceOnUse"><stop stop-color="#adb198" stop-opacity=".61"/><stop offset=".5" stop-color="#939f7d" stop-opacity=".7"/><stop offset="1" stop-color="#768566" stop-opacity=".8"/></linearGradient>
    <linearGradient id="br18-leaf-fold" x1="218" y1="145" x2="263" y2="223" gradientUnits="userSpaceOnUse"><stop stop-color="#b4b59b" stop-opacity=".55"/><stop offset="1" stop-color="#83916f" stop-opacity=".76"/></linearGradient>
    <linearGradient id="br18-calyx" x1="-4" y1="-7" x2="4" y2="-7" gradientUnits="userSpaceOnUse"><stop stop-color="#a9ae88" stop-opacity=".8"/><stop offset=".45" stop-color="#b8bb98" stop-opacity=".8"/><stop offset="1" stop-color="#7f8c65" stop-opacity=".9"/></linearGradient>
