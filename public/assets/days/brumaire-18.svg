      <g stroke="#8a8668" stroke-width=".46">
        <path d="M-3.4-3.1Q-5.1-3.5-6.2-2.7M-3.7-5.6Q-5.4-6.2-6.3-5.7M-3.8-8.3L-6.6-9.2M-3.8-11L-6.3-12.8M-3.4-13L-5.3-15.1M3.1-3.5Q5-3.4 5.8-2.4M3.7-6Q5.2-6.2 6.5-5.6M4-8.5L6.6-9M4-11.4L6.5-12.6M3.5-13.3L5.2-15.1"/>
