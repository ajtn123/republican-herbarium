    <radialGradient id="br18-petal" cx=".4" cy=".24" r=".85"><stop stop-color="#e8e0e3" stop-opacity=".86"/><stop offset=".57" stop-color="#d8c9d7" stop-opacity=".85"/><stop offset="1" stop-color="#b6a5bc" stop-opacity=".82"/></radialGradient>
    <linearGradient id="br18-bud" x1="-2" y1="-25" x2="3" y2="-12" gradientUnits="userSpaceOnUse"><stop stop-color="#d6bfca"/><stop offset="1" stop-color="#b6acb8" stop-opacity=".85"/></linearGradient>
