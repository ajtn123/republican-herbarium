<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="nivose-04-title nivose-04-desc">
  <title id="nivose-04-title">Soufre — soufre natif</title>
  <desc id="nivose-04-desc">A natural cluster of pale lemon-yellow orthorhombic sulfur crystals on a rough warm-grey rock matrix. Unequal broad bipyramids show triangular faces, fine growth steps and ochre shaded lower planes; small broken sulfur fragments lie beside the specimen.</desc>
  <defs>
    <linearGradient id="nivose-04-rock" x1="125" y1="193" x2="204" y2="298" gradientUnits="userSpaceOnUse"><stop stop-color="#ccc5b4" stop-opacity=".64"/><stop offset=".47" stop-color="#b0a895" stop-opacity=".82"/><stop offset="1" stop-color="#8f8572" stop-opacity=".85"/></linearGradient>
