<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vt28-title vt28-desc">
  <title id="vt28-title">Tomate — Solanum lycopersicum</title>
  <desc id="vt28-desc">A softly hairy garden tomato branch bears a broad, slightly ribbed brick-red tomato beneath its long pointed green calyx, a smaller green fruit, and one little yellow star flower. Unequal, deeply lobed leaflets spread along two irregular pinnate leaves; fine curved engraving strokes follow their veins and the swelling fruit.</desc>
