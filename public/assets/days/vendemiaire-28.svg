    <linearGradient id="vt28-stem" x1="177" y1="190" x2="186" y2="188" gradientUnits="userSpaceOnUse"><stop stop-color="#a9ac88"/><stop offset=".5" stop-color="#89946a"/><stop offset="1" stop-color="#657453"/></linearGradient>
    <linearGradient id="vt28-leaf" x1="100" y1="59" x2="165" y2="162" gradientUnits="userSpaceOnUse"><stop stop-color="#a5ac8d" stop-opacity=".57"/><stop offset=".5" stop-color="#929e7d" stop-opacity=".69"/><stop offset="1" stop-color="#6f805e" stop-opacity=".81"/></linearGradient>
