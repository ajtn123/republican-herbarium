    <linearGradient id="br22-wood" x1="160" y1="193" x2="168" y2="197" gradientUnits="userSpaceOnUse"><stop stop-color="#b19a7b"/><stop offset=".4" stop-color="#9a8268"/><stop offset="1" stop-color="#786651"/></linearGradient>
    <linearGradient id="br22-leaf" x1="-24" y1="-63" x2="19" y2="-8" gradientUnits="userSpaceOnUse"><stop stop-color="#b0b197" stop-opacity=".64"/><stop offset=".48" stop-color="#98a080" stop-opacity=".72"/><stop offset="1" stop-color="#79896a" stop-opacity=".83"/></linearGradient>
