<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br22-title br22-desc">
  <title id="br22-title">Azerole — Crataegus azarolus</title>
  <desc id="br22-desc">A fruiting Mediterranean azarole hawthorn twig. Small golden russet pomes bear dry five-pointed calyx stars; the alternate grey-green leaves have wedge-shaped bases, shallow toothed lobes and branching veins. A short woody thorn projects from the twig. Beside it, a cut fruit reveals pale flesh and three hard stones.</desc>
