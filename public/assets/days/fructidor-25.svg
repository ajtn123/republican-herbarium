<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fructidor25-title fructidor25-desc">
<title id="fructidor25-title">Écrevisse — Astacus astacus</title>
<desc id="fructidor25-desc">A living European freshwater crayfish in a slightly diagonal dorsal view. An olive and umber cephalothorax bears a toothed rostrum, two small stalked eyes, two long antennae and short forked antennules. Its first pair of walking limbs ends in large, unequal articulated pincers; four further pairs of slender jointed walking legs spread from beneath the carapace. Six overlapping abdominal segments taper to a broad tail fan with a central telson and paired, two-part uropods. Fine warm-grey contours, curved shell hatching and translucent muted washes form a natural-history engraving on a transparent field.</desc>
