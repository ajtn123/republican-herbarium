<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v05-title v05-desc">
  <title id="v05-title">Vendémiaire 5 — Cheval</title>
  <desc id="v05-desc">Un cheval de travail adulte, calme et sans harnachement, se tient de profil vers la gauche. Sa robe alezane est ombrée de fines tailles de gravure, sa crinière et sa longue queue restent tranquilles, et ses quatre jambes portent des sabots sombres.</desc>
  <defs>
    <linearGradient id="v05-coat" x1="175" y1="102" x2="194" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b29878" stop-opacity=".55"/>
      <stop offset=".42" stop-color="#ab8768" stop-opacity=".64"/>
      <stop offset="1" stop-color="#80634e" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="v05-far-coat" x1="180" y1="197" x2="204" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8e735a" stop-opacity=".86"/>
      <stop offset="1" stop-color="#76634e" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="v05-hair" x1="292" y1="161" x2="320" y2="273" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72604b" stop-opacity=".88"/>
      <stop offset="1" stop-color="#5e5544" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="v05-muzzle" x1="51" y1="135" x2="64" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8aa8c" stop-opacity=".65"/>
      <stop offset="1" stop-color="#8e846a" stop-opacity=".72"/>
    </linearGradient>
  </defs>
