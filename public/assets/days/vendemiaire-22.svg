<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vendemiaire22-title vendemiaire22-desc">
<title id="vendemiaire22-title">Pêche — 桃 — Prunus persica</title>
<desc id="vendemiaire22-desc">A short woody peach twig bearing slender finely serrated lanceolate leaves, beside a softly downy yellow peach washed with rose and marked by its natural suture. An opened half reveals golden flesh, a red-stained cavity and the deeply furrowed, pointed brown stone.</desc>
