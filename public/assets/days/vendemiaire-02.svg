    <linearGradient id="vs02-rear" x1="151" y1="44" x2="181" y2="206" gradientUnits="userSpaceOnUse"><stop stop-color="#c9bdcf"/><stop offset=".53" stop-color="#b7a1bf"/><stop offset="1" stop-color="#8c789b"/></linearGradient>
    <linearGradient id="vs02-left" x1="90" y1="98" x2="176" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#c8b5cb"/><stop offset=".54" stop-color="#bca7c4"/><stop offset="1" stop-color="#9883a1"/></linearGradient>
