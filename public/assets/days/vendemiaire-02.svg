<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vs02-title vs02-desc">
  <title id="vs02-title">Safran — Crocus sativus</title>
  <desc id="vs02-desc">One low autumn saffron crocus opens six softly veined lilac tepals around three golden stamens and three long, separate rust-red stigma branches. Very narrow leaves with pale central stripes rise from its papery basal sheaths; one smaller closed flower stands beside it.</desc>
