<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire05-title frimaire05-desc">
  <title id="frimaire05-title">Frimaire 5 — Cochon</title>
  <desc id="frimaire05-desc">A calm adult farm pig stands facing left, its heavy grey-rose and ochre barrel resting on four short sturdy legs. Small folded ears, a broad blunt snout with two nostrils, divided dark hooves with little dewclaws, sparse bristles and a tightly curled tail distinguish the animal. Fine curved engraving follows the jowl, shoulder and rounded haunch beneath translucent muted washes.</desc>
  <defs>
    <linearGradient id="frimaire05-coat" x1="185" y1="121" x2="198" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c1b39f" stop-opacity=".76"/>
      <stop offset=".46" stop-color="#b3a08e" stop-opacity=".8"/>
      <stop offset="1" stop-color="#968172" stop-opacity=".89"/>
    </linearGradient>
    <linearGradient id="frimaire05-head" x1="97" y1="143" x2="116" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b6a38e" stop-opacity=".86"/>
      <stop offset=".5" stop-color="#bba18f" stop-opacity=".83"/>
      <stop offset="1" stop-color="#9c8374" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="frimaire05-far" x1="186" y1="216" x2="195" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d7c6c" stop-opacity=".93"/>
      <stop offset="1" stop-color="#aa9680" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="frimaire05-ear" x1="100" y1="118" x2="108" y2="163" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bcaa93" stop-opacity=".91"/>
      <stop offset="1" stop-color="#ad8d7e" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="frimaire05-snout" x1="43" y1="188" x2="66" y2="219" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9b19f" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#bba090" stop-opacity=".94"/>
      <stop offset="1" stop-color="#a58a79" stop-opacity=".95"/>
    </linearGradient>
  </defs>
