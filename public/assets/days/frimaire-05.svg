    <path d="M139 281L138 286M264 282L262 287" stroke="#564c40" stroke-width=".75"/>
    <path d="M147 267L151 268L151 272L148 272ZM131 267L128 267L129 271L132 271ZM271 269L275 270L274 274L271 273ZM258 268L255 267L255 271L258 272Z" fill="#8b7b64" stroke-width=".7"/>
