      <path d="M105 188q3 1 2 4M116 186q3 1 2 4M127 185q3 1 2 4M138 185q3 1 2 4M149 186q3 1 2 4M160 187q3 1 2 4M171 189q3 1 2 4M182 191q3 1 2 4M193 192q3 1 2 4M206 194q3 1 2 4M220 195q3 1 2 4M234 194q3 1 2 4" opacity=".7"/>
      <path d="M111 198q3 1 2 4M123 196q3 1 2 4M135 196q3 1 2 4M147 197q3 1 2 4M159 198q3 1 2 4M171 200q3 1 2 4M183 201q3 1 2 4M195 202q3 1 2 4M209 202q3 1 2 4M223 200q3 1 2 4M126 207q3 1 2 4M140 207q3 1 2 4M154 208q3 1 2 4M169 209q3 1 2 4M183 209q3 1 2 4"/>
    </g>
    <!-- Sparse irregular dark spots are concentrated above the lateral line. -->
    <g fill="#4d5b52" fill-opacity=".82" stroke="none">
      <path d="M104 162l1.8-.8.8 1.7-1.7 1.1Z M118 158l1.7.5-.2 1.8-1.8-.4Z M130 163l1.9-1 .9 1.7-1.6 1.1Z M146 157l1.8.6-.5 1.5-1.6-.2Z M158 165l2-.5.4 1.6-1.9.6Z M172 160l1.4-.5 1 1.6-1.6.9Z M185 169l1.9-.8.8 1.6-1.7.9Z M200 169l1.9.4-.4 1.8-1.6-.2Z M214 177l1.5-.6.7 1.4-1.6.7Z M231 179l1.5.2-.1 1.5-1.6-.1Z"/>
      <path d="M112 173l1.6-.6.9 1.4-1.7.8Z M140 169l1.8.3-.2 1.8-1.9-.5Z M153 173l1.4-.7.8 1.4-1.6.8Z M169 172l1.6.5-.4 1.6-1.5-.4Z M192 178l1.5-.4.6 1.5-1.7.5Z M78 167l1.6-.5.8 1.3-1.7.7Z M88 173l1.5-.5.8 1.4-1.6.7Z"/>
    </g>
    <!-- Compact eye and gently rounded jaws, without spawning distortion. -->
    <path d="M60 175C60 171 63 168 67 169C71 169 73 173 71 176C69 180 63 179 60 175Z" fill="#c5c5a9" fill-opacity=".81" stroke-width=".72"/>
    <circle cx="66.3" cy="173.7" r="2.9" fill="#49534a" stroke-width=".65"/>
    <circle cx="65.4" cy="172.7" r=".73" fill="#efebd0" stroke="none"/>
    <path d="M61 168C64 166 68 166 71 169M62 180C65 182 69 181 72 179M53 173l2-1M54 175l2-.3" stroke-width=".56" opacity=".78"/>
    <path d="M40 181C50 182 59 184 69 185C73 185 76 183 77 181M40 186C49 190 60 192 69 191C73 191 77 189 79 187M46 185C53 187 62 188 69 188" stroke-width=".87"/>
    <path d="M74 184C76 187 78 189 82 190M49 179l6 1M70 190l4-1" stroke-width=".6" opacity=".7"/>
    <!-- Broad, smooth gill cover bounded by a curved rear edge. -->
    <path d="M83 160C94 165 102 175 102 187C102 195 98 202 93 206M85 163C94 168 99 177 99 187C98 195 95 200 91 203" stroke-width=".95"/>
    <path d="M80 173C85 176 88 182 87 188C87 195 83 198 78 199M81 192C85 194 90 194 94 192M77 165l5 1M83 202l5 2" stroke-width=".62" opacity=".73"/>
    <!-- Near pectoral fin attaches low immediately behind the operculum. -->
    <path d="M100 191C110 194 124 203 139 215C127 214 113 210 104 202C100 198 98 194 100 191Z" fill="url(#fructidor-05-fin)" stroke-width="1.05"/>
    <path d="M101 194C112 201 125 209 135 213M102 197C111 205 121 210 130 212M106 194C118 200 127 206 132 210M106 202L120 210" stroke-width=".6" opacity=".8"/>
