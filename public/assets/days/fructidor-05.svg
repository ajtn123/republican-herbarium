    <g stroke="#70796a" stroke-width=".53" opacity=".58">
      <path d="M104 156l2 4M111 154l2 4M121 153l2 4M133 152l2 4M147 152l2 4M162 153l2 4M178 156l2 4M193 160l2 4M209 166l2 4M225 172l2 4M237 176l3 3"/>
      <path d="M104 205q4 4 9 5M116 208q4 4 10 4M130 211q4 3 9 3M144 212q5 3 10 3M160 213q5 3 10 2M193 210q5 1 10-2M207 207q5 1 10-3M251 187l5-3M259 187l5-3M268 186l5-3M270 190l5-2"/>
      <path d="M90 169l4 6M92 178l3 5M92 188l2 5M88 197l3 3M76 193l4 2M71 196l4 2M97 201l4 3M218 195l6-2M239 189l5-1"/>
