<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fructidor-05-title fructidor-05-desc">
  <title id="fructidor-05-title">Saumon — Salmo salar</title>
  <desc id="fructidor-05-desc">An adult Atlantic salmon in its silvery sea-going phase, facing left. The elongated body has a muted blue olive back, silver cream sides and sparse small dark spots above its fine lateral line. A single rayed dorsal fin and a small fleshy adipose fin precede a moderately forked tail; pectoral, abdominal pelvic and posterior anal fins carry delicate engraved rays. The head has a natural small eye, a gently rounded snout and an unhooked jaw.</desc>
  <defs>
    <linearGradient id="fructidor-05-body" x1="164" y1="149" x2="166" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6e807d" stop-opacity=".87"/>
      <stop offset=".22" stop-color="#97a29a" stop-opacity=".74"/>
      <stop offset=".49" stop-color="#c2c8ba" stop-opacity=".7"/>
      <stop offset=".73" stop-color="#dedfcf" stop-opacity=".72"/>
      <stop offset="1" stop-color="#c8c5ac" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="fructidor-05-head" x1="70" y1="159" x2="80" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ba79c" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#e0dfca" stop-opacity=".56"/>
      <stop offset="1" stop-color="#c1bfaa" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="fructidor-05-fin" x1="177" y1="117" x2="181" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76817a" stop-opacity=".66"/>
      <stop offset=".5" stop-color="#a2a793" stop-opacity=".72"/>
      <stop offset="1" stop-color="#b7b092" stop-opacity=".63"/>
    </linearGradient>
    <linearGradient id="fructidor-05-tail" x1="278" y1="184" x2="326" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78877e" stop-opacity=".83"/>
      <stop offset="1" stop-color="#a4aa94" stop-opacity=".68"/>
    </linearGradient>
    <clipPath id="fructidor-05-scaled-flank"><path d="M99 159C129 146 167 148 199 158C229 168 247 178 278 177L282 190C254 190 232 201 210 207C176 217 135 219 98 204C106 190 107 174 99 159Z"/></clipPath>
  </defs>
  <g stroke="#62665a">
    <!-- Far pelvic fin, behind the pale abdomen. -->
    <path d="M177 211C183 220 191 228 200 230C196 220 192 213 186 209Z" fill="#a6aa95" fill-opacity=".56" stroke-width=".85"/>
    <path d="M181 212L196 227M186 213L195 223" stroke-width=".55" opacity=".6"/>
    <!-- A single soft dorsal, with a short base and slanting leading edge. -->
    <path d="M128 152C134 142 139 124 145 114C152 116 158 124 165 129C172 135 178 143 187 154C165 151 146 150 128 152Z" fill="url(#fructidor-05-fin)" stroke-width="1.2"/>
    <path d="M132 150L145 116M137 150L150 119M142 150L155 124M148 150L160 128M154 150L165 131M160 150L169 135M166 151L174 141M173 151L179 146M180 152L183 150" stroke-width=".65" opacity=".78"/>
    <path d="M142 133L146 123M150 138L155 129M159 143L164 135M170 147L174 143" stroke="#d4d4b9" stroke-width=".62" opacity=".7"/>
    <!-- Salmon caudal: broad, moderately forked, supported by an unkeeled stalk. -->
    <path d="M274 177C291 172 306 154 325 145C322 157 315 172 304 183C315 194 323 209 326 223C308 216 291 199 275 194C273 189 273 182 274 177Z" fill="url(#fructidor-05-tail)" stroke-width="1.35"/>
    <path d="M279 181C294 175 308 158 321 150M281 183C296 178 308 165 319 157M282 184C296 181 308 172 314 166M284 185L306 178M280 189C297 197 311 211 322 219M281 187C299 193 311 205 321 213M284 187C299 190 310 197 317 203M286 186L309 191" stroke-width=".65" opacity=".8"/>
    <path d="M292 175L308 160M299 174L313 161M291 198L310 213M300 198L317 214M287 183L297 180M289 189L301 193" stroke="#d7d6bb" stroke-width=".6" opacity=".65"/>
    <!-- A low, extended fusiform body, with no spawning hump or kype. -->
    <path d="M39 179C47 172 56 166 68 163C82 159 93 155 106 153C134 148 161 148 186 154C214 160 234 173 255 177C264 179 273 178 280 177L285 182L283 190C266 190 252 193 235 199C208 210 180 217 148 216C124 215 104 210 87 203C73 198 59 193 47 190C41 189 37 186 38 184L43 182Z" fill="url(#fructidor-05-body)" stroke-width="1.45"/>
    <path d="M70 163C101 152 131 148 159 152C190 154 210 164 232 174C201 164 179 160 155 160C125 158 100 164 75 169Z" fill="#647d7e" fill-opacity=".19" stroke="none"/>
    <path d="M101 188C133 190 167 189 195 186C223 183 246 183 272 184C249 188 226 196 199 202C161 210 126 206 102 199Z" fill="#eef0df" fill-opacity=".3" stroke="none"/>
    <path d="M41 179C55 171 67 166 82 161C94 166 101 175 101 187C102 198 98 204 94 206C76 201 62 194 47 190L39 186L43 182Z" fill="url(#fructidor-05-head)" stroke="none"/>
