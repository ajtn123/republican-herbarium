    <g stroke="#ebead4" stroke-width=".73" opacity=".7">
      <path d="M95 157C112 152 130 151 143 152M158 153C173 154 185 158 195 161M111 209C125 213 137 215 149 214M196 211C207 208 218 204 226 201M52 178l5-2M80 200l7 3M278 181l4 1"/>
      <path d="M118 188l6 1M137 191l6 1M159 193l6 1M180 194l6-.4M200 194l6-1M229 189l6-.5M79 180l3 4M89 182l2 4" opacity=".7"/>
