      <path d="M111 157q3 1 2 4M120 155q3 1 2 4M130 154q3 1 2 4M141 154q3 1 2 4M152 155q3 1 2 4M163 156q3 1 2 4M174 158q3 1 2 4M185 161q3 1 2 4M196 164q3 1 2 4M207 168q3 1 2 4M218 172q3 1 2 4M229 176q3 1 2 4M242 180q3 1 2 4M256 181q3 1 2 4"/>
