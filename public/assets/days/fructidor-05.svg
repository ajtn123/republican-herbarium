    <path d="M167 217L188 233M173 216L189 230M178 215L188 226M171 222L182 230" stroke-width=".6" opacity=".8"/>
    <!-- Posterior anal fin and the small fleshy adipose, with no finlets. -->
    <path d="M221 204C228 207 237 206 242 203C242 212 246 221 250 229C238 225 226 215 221 204Z" fill="url(#fructidor-05-fin)" stroke-width="1.1"/>
    <path d="M225 206L246 226M230 206L246 222M235 206L245 218M239 205L243 213" stroke-width=".61" opacity=".8"/>
