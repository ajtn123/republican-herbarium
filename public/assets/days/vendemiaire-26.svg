<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vendemiaire-26-title vendemiaire-26-desc">
  <title id="vendemiaire-26-title">Aubergine — Solanum melongena</title>
  <desc id="vendemiaire-26-desc">A branching aubergine specimen bears a single weighty, elongated dusty-purple fruit beneath its pointed green calyx. Broad, shallowly lobed grey-green leaves show branching veins and soft engraving hatches; one small five-pointed lilac blossom opens around a cone of yellow anthers.</desc>
