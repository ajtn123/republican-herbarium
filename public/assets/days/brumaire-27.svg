<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br27-title br27-desc">
  <title id="br27-title">Macjonc — illustrative tuber-bearing sedge</title>
  <desc id="br27-desc">An illustrative chufa-like sedge form for the historically ambiguous name Macjonc: a three-ridged upright culm, narrow basal leaves, and an open umbrella of slender ochre-brown spikelets above three long leaf-like bracts. Fine underground rhizomes bear small oval brown tubers among fibrous roots. This drawing suggests an edible underground sedge, without identifying the old name with an exact species.</desc>
  <defs>
    <linearGradient id="br27-leaf" x1="100" y1="150" x2="178" y2="266" gradientUnits="userSpaceOnUse"><stop stop-color="#b1b495" stop-opacity=".57"/><stop offset=".45" stop-color="#939e79" stop-opacity=".71"/><stop offset="1" stop-color="#737f5d" stop-opacity=".8"/></linearGradient>
    <linearGradient id="br27-leaf-right" x1="270" y1="141" x2="191" y2="268" gradientUnits="userSpaceOnUse"><stop stop-color="#a9af91" stop-opacity=".58"/><stop offset="1" stop-color="#7e8c64" stop-opacity=".78"/></linearGradient>
    <linearGradient id="br27-culm" x1="179" y1="160" x2="186" y2="161" gradientUnits="userSpaceOnUse"><stop stop-color="#aeb692"/><stop offset=".43" stop-color="#bac09d"/><stop offset=".48" stop-color="#83916a"/><stop offset="1" stop-color="#74815d"/></linearGradient>
    <linearGradient id="br27-tuber" x1="0" y1="0" x2="1" y2=".75"><stop stop-color="#c0a47b" stop-opacity=".9"/><stop offset=".48" stop-color="#a4875e" stop-opacity=".93"/><stop offset="1" stop-color="#7f6548" stop-opacity=".95"/></linearGradient>
    <linearGradient id="br27-spike" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#c3ad79"/><stop offset=".5" stop-color="#af9460"/><stop offset="1" stop-color="#8e754d"/></linearGradient>
