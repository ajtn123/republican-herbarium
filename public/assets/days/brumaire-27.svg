      <path d="M0 0L21.5 0" stroke="#746447" stroke-width=".6"/>
      <path d="M3.1-.2L5-1.95M6-.1L8-2.12M9-.1L11-2.05M12-.1L14-1.85M15-.1L17-1.5M18-.1L19-.75M3.7.1L5.6 2M6.8.1L8.6 2.3M9.8.1L11.7 2.1M12.8.1L14.5 1.9M15.7.1L17.1 1.5M18.5.1L19.4.8"/>
