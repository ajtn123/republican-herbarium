<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vp27-title vp27-desc">
  <title id="vp27-title">Piment — Capsicum annuum</title>
  <desc id="vp27-desc">A branching pepper sprig with smooth pointed ovate leaves, a small five-petalled ivory flower, and two pendant, slender peppers. The ripe fruit is muted rust red and the younger fruit olive green; each has a five-pointed green calyx. Fine veins and curved engraved hatching follow the leaves and tapering fruits.</desc>
