<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fl25-title fl25-desc">
  <title id="fl25-title">Carpe — Cyprinus carpio</title>
  <desc id="fl25-desc">A bronze olive common carp in left profile. Its deep arched back carries a long dorsal fin; broad overlapping cycloid scales cover the flanks. A small eye, fleshy protrusible lips and two pairs of short barbels distinguish the scaleless head. Paired pectoral and pelvic fins, a short anal fin and a deeply forked tail bear fine engraved rays.</desc>
