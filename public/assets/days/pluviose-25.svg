<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pluviose-25-title pluviose-25-desc">
  <title id="pluviose-25-title">Lièvre — Lepus europaeus</title>
  <desc id="pluviose-25-desc">An alert European brown hare in a raised half crouch, facing left. A slender long-muzzled head, very long black-tipped upright ears, amber lateral eye, rangy tawny agouti body and large muscular folded hind legs distinguish it from a domestic rabbit. Fine warm umber engraving follows the fur over transparent ochre and grey-brown watercolor washes.</desc>
  <defs>
    <linearGradient id="pluviose-25-coat" x1="191" y1="166" x2="205" y2="283" gradientUnits="userSpaceOnUse"><stop stop-color="#b5a083" stop-opacity=".81"/><stop offset=".43" stop-color="#a78e6b" stop-opacity=".87"/><stop offset="1" stop-color="#8d7c63" stop-opacity=".86"/></linearGradient>
    <linearGradient id="pluviose-25-head" x1="102" y1="126" x2="93" y2="189" gradientUnits="userSpaceOnUse"><stop stop-color="#b39c78" stop-opacity=".87"/><stop offset=".6" stop-color="#ac9270" stop-opacity=".84"/><stop offset="1" stop-color="#c1ac8b" stop-opacity=".9"/></linearGradient>
    <linearGradient id="pluviose-25-ear" x1="104" y1="40" x2="120" y2="142" gradientUnits="userSpaceOnUse"><stop stop-color="#a59479" stop-opacity=".89"/><stop offset=".5" stop-color="#c1ae8b" stop-opacity=".82"/><stop offset="1" stop-color="#a58c6b" stop-opacity=".91"/></linearGradient>
