    <linearGradient id="pluviose-25-cream" x1="124" y1="189" x2="161" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#dfd2b6" stop-opacity=".83"/><stop offset="1" stop-color="#d3c2a0" stop-opacity=".8"/></linearGradient>
  </defs>
