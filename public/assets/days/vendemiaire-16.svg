<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="vn16-title vn16-desc">
  <title id="vn16-title">Belle de nuit — Mirabilis jalapa</title>
  <desc id="vn16-desc">A curved, branching four-o'clock stem carries opposite pairs of broad, pointed, heart-based olive leaves. Two softly pigmented rose and cream trumpets show long narrow floral tubes, continuous five-lobed flared mouths and projecting stamens. One slender closed evening bud rises between them.</desc>
