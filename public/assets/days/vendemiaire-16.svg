    <linearGradient id="vn16-stem" x1="166" y1="215" x2="183" y2="218" gradientUnits="userSpaceOnUse"><stop stop-color="#a4a889"/><stop offset=".45" stop-color="#929b78"/><stop offset="1" stop-color="#717d5e"/></linearGradient>
    <linearGradient id="vn16-leaf-left" x1="90" y1="160" x2="150" y2="288" gradientUnits="userSpaceOnUse"><stop stop-color="#a6ac8e" stop-opacity=".64"/><stop offset=".58" stop-color="#929c7b" stop-opacity=".66"/><stop offset="1" stop-color="#778562" stop-opacity=".74"/></linearGradient>
