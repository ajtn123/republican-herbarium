<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="brumaire-01-title brumaire-01-desc">
  <title id="brumaire-01-title">Pomme — Malus domestica</title>
  <desc id="brumaire-01-desc">A short apple twig bears finely serrated oval leaves and a broad, slightly uneven ochre and muted red apple. Its curved woody stalk enters a sunken crown, and small dry sepals remain in the indented blossom end. A separate transverse cut fruit shows cream flesh around five radiating seed chambers, forming the apple's characteristic star-shaped core.</desc>
