<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire11-title frimaire11-desc">
  <title id="frimaire11-title">Cire — beeswax</title>
  <desc id="frimaire11-desc">A pale golden block of solid beeswax, with an uneven broken edge and fine parallel striations, rests beside curled, paper-thin wax shavings. One slender hand-dipped candle has a short unlit cotton wick. A little empty comb, its thin hexagonal walls cream-coloured, recalls the origin of the matte wax.</desc>
