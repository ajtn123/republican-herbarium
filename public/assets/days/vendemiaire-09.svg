<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v09-title v09-desc">
  <title id="v09-title">Vendémiaire 9 — Panais</title>
  <desc id="v09-desc">A single parsnip, Pastinaca sativa: a substantial cream-coloured tapering root with irregular growth rings and fine lateral rootlets, crowned by pinnate foliage with broad, lobed and toothed olive-green leaflets. Warm ochre and grey washes give the pale root its rounded volume.</desc>
