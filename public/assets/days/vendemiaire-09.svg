    </linearGradient>
    <linearGradient id="v09-leaf" x1="75" y1="43" x2="221" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ba180" stop-opacity=".59"/><stop offset=".5" stop-color="#7f8b66" stop-opacity=".65"/><stop offset="1" stop-color="#697655" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="v09-leaf-turn" x1="238" y1="50" x2="194" y2="147" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5aa8a" stop-opacity=".55"/><stop offset="1" stop-color="#7e8a69" stop-opacity=".6"/>
