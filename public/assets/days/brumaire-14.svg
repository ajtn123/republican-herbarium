    <linearGradient id="br14-side" x1="0" y1=".1" x2=".8" y2="1"><stop stop-color="#b4b99c" stop-opacity=".6"/><stop offset=".54" stop-color="#8f9d7c" stop-opacity=".7"/><stop offset="1" stop-color="#728364" stop-opacity=".8"/></linearGradient>
    <linearGradient id="br14-inner" x1=".3" y1="0" x2=".7" y2="1"><stop stop-color="#e6e2bd" stop-opacity=".72"/><stop offset=".45" stop-color="#d0d3ac" stop-opacity=".74"/><stop offset="1" stop-color="#a4af86" stop-opacity=".84"/></linearGradient>
    <linearGradient id="br14-heart" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#eee7c9" stop-opacity=".89"/><stop offset=".6" stop-color="#dfddba" stop-opacity=".84"/><stop offset="1" stop-color="#bbc39b" stop-opacity=".89"/></linearGradient>
