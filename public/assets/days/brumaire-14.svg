<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br14-title br14-desc">
  <title id="br14-title">Endive — illustrative cultivated endive</title>
  <desc id="br14-desc">An open leafy rosette of cultivated endive, illustrated without assigning an exact historic variety. Deeply cut, curled sage green outer blades spread around a loose cream heart. Broad pale midribs converge at a short earthy root base; fine branching veins and curved engraving strokes describe the crumpled foliage.</desc>
