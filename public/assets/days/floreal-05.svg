<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="floreal05-title floreal05-desc">
  <title id="floreal05-title">Floréal 5 — Rossignol</title>
  <desc id="floreal05-desc">A common nightingale sings quietly in left profile on a single slender twig. Its modest dark eye and narrow, slightly parted insect-eating bill sit in a plain warm-brown head. Soft umber feathers cover the back and folded wing, the throat and rounded belly are pale buff, and long overlapping tail feathers are distinctly rufous. Two slim scaled legs end in fine toes clasping the twig. Muted transparent washes and fine curved engraving strokes describe the plumage.</desc>
