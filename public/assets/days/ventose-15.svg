<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="ventose-15-title ventose-15-desc">
  <title id="ventose-15-title">Chèvre — female domestic goat</title>
  <desc id="ventose-15-desc">A lean adult doe stands turned slightly towards the viewer, her long face looking left. Fine ridged horns sweep gently backwards above pointed ears. A pale cream coat, grey-brown face and legs, slender neck, short upright tail, four divided hooves and a small natural udder distinguish this female domestic goat. Fine umber engraving strokes follow the hair and anatomy.</desc>
