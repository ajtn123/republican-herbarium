<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire25-title frimaire25-desc">
  <title id="frimaire25-title">Grillon — Gryllus campestris</title>
  <desc id="frimaire25-desc">An adult field cricket viewed obliquely from the side, with a rounded black head, shield-shaped pronotum, finely veined folded forewings and a segmented abdomen. Exactly six jointed legs include two greatly enlarged jumping femora and long spined hind tibiae. Two very long threadlike antennae sweep above the specimen, and two short cerci project from the rear. Warm umber engraving and restrained grey-brown washes describe the dark chitin.</desc>
