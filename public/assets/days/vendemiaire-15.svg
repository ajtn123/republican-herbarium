<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="v15-title v15-desc">
  <title id="v15-title">Vendémiaire 15 — Âne</title>
  <desc id="v15-desc">Un âne adulte gris-brun se tient paisiblement de profil vers la gauche. Ses longues oreilles dressées, sa grosse tête au museau clair, sa courte crinière droite et sa queue fine terminée par une touffe le distinguent du cheval. Quatre jambes fines aux articulations observées portent de petits sabots sombres.</desc>
  <defs>
    <linearGradient id="v15-coat" x1="167" y1="118" x2="197" y2="239" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b2ada0" stop-opacity=".76"/>
      <stop offset=".52" stop-color="#9c978a" stop-opacity=".79"/>
      <stop offset="1" stop-color="#827c6b" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="v15-far" x1="181" y1="208" x2="198" y2="305" gradientUnits="userSpaceOnUse">
      <stop stop-color="#878473" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a09a85" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="v15-ear" x1="97" y1="48" x2="115" y2="113" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aaa491" stop-opacity=".87"/>
      <stop offset="1" stop-color="#908b79" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="v15-muzzle" x1="58" y1="158" x2="65" y2="191" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2c9b5" stop-opacity=".84"/>
