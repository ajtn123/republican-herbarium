  <title id="vs18-title">Sarrasin — Fagopyrum esculentum</title>
  <desc id="vs18-desc">A slender branching buckwheat specimen, with red-brown jointed stems, broad pointed triangular leaves with heart-shaped bases, loose sprays of tiny cream and pale pink flowers, and three brown three-sided achenes.</desc>
