<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br28-title br28-desc">
  <title id="br28-title">Coing — Cydonia oblonga</title>
  <desc id="br28-desc">A short quince twig bears a large, uneven pear-shaped yellow fruit with knobbly shoulders, a faint felted bloom and a persistent dry five-pointed calyx. Three broad, entire oval leaves show curved veins and the pale downy underside of one turned blade. A small cut wedge reveals dense cream flesh and dark brown seeds.</desc>
