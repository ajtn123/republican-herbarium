<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="frimaire30-title frimaire30-desc">
  <title id="frimaire30-title">Pelle — a broad iron shovel</title>
  <desc id="frimaire30-desc">An eighteenth-century shovel lies obliquely, its long, slightly bowed oak shaft ending in a simple wooden T-grip. A riveted iron socket joins it to a broad, shallow concave scoop. Turned shoulders, raised side rims and a gently rounded, worn cutting edge distinguish the shovel used to lift loose earth or grain. Fine wood grain and curved engraving strokes model muted ochre wood and weathered grey iron.</desc>
