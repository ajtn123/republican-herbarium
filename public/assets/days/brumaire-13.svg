<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="br13-title br13-desc">
  <title id="br13-title">Topinambour — Helianthus tuberosus</title>
  <desc id="br13-desc">A short Jerusalem artichoke sprig bears rough, toothed, three-veined leaves and a small yellow composite flower. Below it, two rose-ochre stem tubers swell into irregular segmented knobs, their pink bud scales and sunken necks connected by a thin winding stolon. Fine curved umber engraving describes the earthy skins.</desc>
