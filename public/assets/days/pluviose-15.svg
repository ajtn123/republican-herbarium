<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pluviose-15-title pluviose-15-desc">
  <title id="pluviose-15-title">Pluviôse 15 — Vache</title>
  <desc id="pluviose-15-desc">An adult cream and warm chestnut dairy cow stands quietly facing right. Her long capacious barrel, narrow shoulders, gently curved horns, fine face, four cloven feet, natural four-teated udder and long brush-tipped tail are rendered in muted watercolor and delicate curved engraving.</desc>
