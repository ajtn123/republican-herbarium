<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Vendémiaire 6 — Garden balsam</title>
  <desc>A supple garden balsam, Impatiens balsamina, with narrow finely toothed leaves, rose-pink asymmetric flowers growing close to the stem, curved nectar spurs and a single swollen ribbed seed capsule.</desc>
