    <linearGradient id="fr12-leaf" x1="119" y1="56" x2="184" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#a4ad8c" stop-opacity=".58"/><stop offset=".55" stop-color="#8c9a77" stop-opacity=".72"/><stop offset="1" stop-color="#697e5b" stop-opacity=".8"/></linearGradient>
