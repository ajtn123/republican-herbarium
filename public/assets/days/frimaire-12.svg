<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fr12-title fr12-desc">
  <title id="fr12-title">Raifort — Armoracia rusticana</title>
  <desc id="fr12-desc">An uprooted horseradish with a thick, bent ivory root, rough tan skin, broken lateral-root scars and fine wandering rootlets. Its crown bears long, broad, crinkled green leaves with wavy finely toothed edges, strong pale midribs and arching side veins. A small broken side root reveals white flesh.</desc>
